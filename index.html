<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>ترتيل</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5a46"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet"><style>
:root{--bg:#f4f1e8;--card:#fff;--tx:#1b2a25;--mu:#6b7a73;--pr:#0f5a46;--pr2:#14795e;--go:#c9a227;--bd:#dfd9c6;--in:#faf8f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a16;--card:#18271f;--tx:#e9efe9;--mu:#9bada4;--pr:#2e9c7c;--pr2:#3bb592;--go:#d9b648;--bd:#2b3d34;--in:#12201a}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:15px;line-height:1.6}
#app{max-width:760px;margin:auto;padding:12px 12px 40px}
.hero{text-align:center;padding:26px 0 14px}.hero img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 18px #0004}.hero h1{margin:8px 0 0;font-size:34px;color:var(--pr)}.hero p{margin:2px 0;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
h2{font-size:17px;margin:0 0 8px;color:var(--pr)}h3{font-size:15px;margin:0 0 6px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:9px;margin:3px 0}
textarea{min-height:70px}
button{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
button.o{background:none;color:var(--pr);border:1px solid var(--pr)}button.d{background:#b3382c}button.s{padding:5px 10px;font-size:13px}
.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--in);color:var(--tx);border:1px solid var(--bd)}.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.top{display:flex;align-items:center;gap:8px;background:var(--pr);color:#fff;border-radius:14px;padding:10px 12px;margin-top:8px}.top b{flex:1}.top button{background:#fff3;padding:5px 10px}
.tabs{display:flex;gap:5px;overflow-x:auto;margin:8px 0}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}.tabs button.on{background:var(--go);color:#222;border-color:var(--go)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.mu{color:var(--mu);font-size:13px}.ck{display:flex;gap:8px;align-items:center;padding:4px 0}.ck input{width:auto}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--bd);padding:5px;text-align:center}th{background:var(--in)}
.st{border-top:1px dashed var(--bd);padding:8px 0}.pill{display:inline-block;background:var(--in);border:1px solid var(--bd);border-radius:20px;padding:1px 10px;font-size:12px;color:var(--mu)}
a.w{display:inline-block;background:#1fa855;color:#fff;border-radius:8px;padding:4px 10px;text-decoration:none;font-size:13px}
.ay{font-family:"KFGQPC HAFS Uthmanic Script","Amiri Quran",serif;font-size:24px;line-height:2.3;text-align:justify;background:var(--in);border-radius:10px;padding:10px;margin:6px 0}.ay b{color:var(--go);font-size:17px}
@media print{body{background:#fff;color:#000}.top,.tabs,.np{display:none!important}.card{border:0}}
</style></head><body><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const SN="الفاتحة,البقرة,آل عمران,النساء,المائدة,الأنعام,الأعراف,الأنفال,التوبة,يونس,هود,يوسف,الرعد,إبراهيم,الحجر,النحل,الإسراء,الكهف,مريم,طه,الأنبياء,الحج,المؤمنون,النور,الفرقان,الشعراء,النمل,القصص,العنكبوت,الروم,لقمان,السجدة,الأحزاب,سبأ,فاطر,يس,الصافات,ص,الزمر,غافر,فصلت,الشورى,الزخرف,الدخان,الجاثية,الأحقاف,محمد,الفتح,الحجرات,ق,الذاريات,الطور,النجم,القمر,الرحمن,الواقعة,الحديد,المجادلة,الحشر,الممتحنة,الصف,الجمعة,المنافقون,التغابن,الطلاق,التحريم,الملك,القلم,الحاقة,المعارج,نوح,الجن,المزمل,المدثر,القيامة,الإنسان,المرسلات,النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(",");
const AC="7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6".split(",").map(Number);
const ICON=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14795e"/><stop offset="1" stop-color="#0a3d30"/></linearGradient></defs><rect width="512" height="512" fill="url(#g)"/><circle cx="256" cy="262" r="196" fill="none" stroke="#d4af37" stroke-width="8"/><path d="M256 215c-40-26-90-30-130-18v180c40-12 90-8 130 18z" fill="#fff"/><path d="M256 215c40-26 90-30 130-18v180c-40-12-90-8-130 18z" fill="#f1e6c3"/><path d="M256 215v180" stroke="#d4af37" stroke-width="6"/><path d="M290 100a52 52 0 1 0 38 82a42 42 0 1 1-38-82z" fill="#d4af37"/></svg>`;
const ICONURL='data:image/svg+xml,'+encodeURIComponent(ICON);
(function(){try{const m={name:"ترتيل",short_name:"ترتيل",lang:"ar",dir:"rtl",display:"standalone",start_url:".",background_color:"#0f5a46",theme_color:"#0f5a46",icons:[{src:ICONURL,sizes:"any",type:"image/svg+xml",purpose:"any maskable"}]};
const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=180;c.getContext('2d').drawImage(i,0,0,180,180);const a=document.createElement('link');a.rel='apple-touch-icon';a.href=c.toDataURL();document.head.appendChild(a)};i.src=ICONURL;
const f=document.createElement('link');f.rel='icon';f.href=ICONURL;document.head.appendChild(f)}catch(e){}})();
/* === الصق إعدادات Firebase هنا === */
const FB={apiKey:"AIzaSyDxKFx6oqz2nVPcSS7X6K6VKo9ytHMd3-Q",authDomain:"tarteel-502a6.firebaseapp.com",projectId:"tarteel-502a6",appId:"1:174660719791:web:44c8a633fec1049674b05a"};
const OK=!FB.apiKey.startsWith('PASTE');let DB={gp:'1111',cx:[]},S={role:null,lr:'g',cid:null,hid:null,tab:'st',rp:null},fs,unsub=[];
const strip=c=>{const{logs,out,...r}=c;return r};
const save=()=>{const c=C();if(c)fs.collection('cx').doc(c.id).set(strip(c)).catch(e=>alert('تعذر الحفظ: '+e.message))};
function soft(){const a=document.activeElement;if((a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName))||S.role=='t')return;if([...document.querySelectorAll('input:not([type=checkbox]),textarea')].some(x=>x.value!==x.defaultValue))return;R()}
function listen(id){unsub.forEach(f=>f());unsub=[];
unsub.push(fs.collection('logs').where('cid','==',id).onSnapshot(q=>{const c=DB.cx.find(x=>x.id==id);if(c){c.logs=q.docs.map(d=>d.data());soft()}}));
unsub.push(fs.collection('out').where('cid','==',id).onSnapshot(q=>{const c=DB.cx.find(x=>x.id==id);if(c){c.out=q.docs.map(d=>({...d.data(),ref:d.id})).sort((a,b)=>b.ts-a.ts);soft()}}))}
function addOut(c,m){fs.collection('out').add({...m,cid:c.id,ts:Date.now()})}
function enter(id){S.role='s';S.cid=id;S.tab='st';listen(id);R()}
if(OK){firebase.initializeApp(FB);fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
fs.doc('meta/main').onSnapshot(d=>{if(d.exists)DB.gp=d.data().gp});
fs.collection('cx').onSnapshot(q=>{DB.cx=q.docs.map(d=>{const o=d.data(),p=DB.cx.find(x=>x.id==o.id);o.logs=p?p.logs:[];o.out=p?p.out:[];return o});soft()})}
const uid=()=>Math.random().toString(36).slice(2,9);
const E=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const $=i=>document.getElementById(i);const V=i=>($(i)||{}).value||'';
const C=()=>DB.cx.find(x=>x.id===S.cid);
const SO=(s,from=0,to=113)=>SN.map((n,i)=>i>=from&&i<=to?`<option value="${i}"${i==s?' selected':''}>${i+1}. ${n}</option>`:'').join('');
const logo=`<img src="${ICONURL}" alt="ترتيل">`;
function newCx(n,wa,p){return{id:uid(),name:n,wa,pass:p||'1111',halaqat:[],students:[],logs:[],out:[],
scale:"ممتاز:100\nجيد جداً:90\nجيد:80\nمقبول:70\nضعيف:50",methods:["حفظ","مراجعة","تثبيت","المراجعة الكبرى"],
t1:"السلام عليكم ولي أمر الطالب {الطالب}\nالتسميع اليوم: {السورة} ({الوجوه} وجه) - {النوع}\nالتقييم: {التقييم}",
t2:"السلام عليكم ولي أمر الطالب {الطالب}\nحضر الطالب اليوم ولم يسمّع.",
t3:"السلام عليكم ولي أمر الطالب {الطالب}\nنفيدكم بغياب الطالب اليوم عن حلقة {الحلقة}."}}
function scale(c){return c.scale.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const k=l.lastIndexOf(':');return k<0?{l,v:parseFloat(l)||0}:{l:l.slice(0,k).trim(),v:parseFloat(l.slice(k+1))||0}})}
function ph(p){p=String(p||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('0'))p='966'+p.slice(1);return p}
function R(){const a=$('app');const x=S.role;a.innerHTML=!x?vLogin():x=='g'?vGen():x=='s'?vSup():vTea()}
function tp(t){return`<div class="top np"><b>${E(t)}</b>${S.role=='g'&&S.cid?'<button onclick="S.cid=null;S.role=\'g\';R()">رجوع</button>':''}<button onclick="S.role=null;S.cid=null;R()">خروج</button></div>`}
/* LOGIN */
function vLogin(){const r=S.lr;const cs=DB.cx.map(c=>`<option value="${c.id}">${E(c.name)}</option>`).join('');
let f=`<input id="pw" type="password" placeholder="كلمة المرور" inputmode="numeric">`;
if(r!='g'){f=(cs?`<select id="lc" onchange="R2()">${cs}</select>`:'<p class="mu">لا توجد مجمعات بعد، يُنشئها المشرف العام أولاً.</p>')+(r=='t'?`<select id="lh"></select>`:'')+f}
setTimeout(R2,0);
return`<div class="hero">${logo}<h1>ترتيل</h1><p>جمعية تحفيظ القرآن الكريم بجلاجل</p></div><div class="card"><div class="seg">${[['g','مشرف عام'],['s','مشرف مجمع'],['t','معلم']].map(([k,n])=>`<button class="${r==k?'on':''}" onclick="S.lr='${k}';R()">${n}</button>`).join('')}</div><div style="margin-top:8px">${f}<button style="width:100%;margin-top:6px" onclick="doLogin()">دخول</button></div><p class="mu">كلمة المرور الافتراضية: 1111</p></div>`}
function R2(){const l=$('lh'),c=DB.cx.find(x=>x.id==V('lc'));if(l&&c)l.innerHTML=c.halaqat.map(h=>`<option value="${h.id}">${E(h.name)}</option>`).join('')}
function doLogin(){const p=V('pw'),r=S.lr;
if(r=='g'){if(p!=DB.gp)return alert('كلمة المرور غير صحيحة');S.role='g';S.cid=null}
else{const c=DB.cx.find(x=>x.id==V('lc'));if(!c)return alert('اختر المجمع');
if(r=='s'){if(p!=c.pass)return alert('كلمة المرور غير صحيحة');S.role='s';S.cid=c.id;S.tab='st';listen(c.id)}
else{const h=c.halaqat.find(x=>x.id==V('lh'));if(!h)return alert('اختر الحلقة');if(p!=h.pass)return alert('كلمة المرور غير صحيحة');S.role='t';S.cid=c.id;S.hid=h.id;listen(c.id)}}
R()}
/* GENERAL */
function vGen(){return tp('المشرف العام')+`<div class="card"><h2>إنشاء مجمع</h2><input id="n" placeholder="اسم المجمع"><input id="w" placeholder="رقم واتساب المجمع (05xxxxxxxx)" inputmode="tel"><input id="p" placeholder="كلمة مرور مشرف المجمع (افتراضي 1111)"><button onclick="addCx()">إضافة</button></div>`+DB.cx.map(c=>`<div class="card"><h3>${E(c.name)}</h3><span class="pill">${c.halaqat.length} حلقة</span> <span class="pill">${c.students.length} طالب</span><div class="row" style="margin-top:8px"><button class="s" onclick="enter('${c.id}')">إدارة المجمع</button><button class="s d" onclick="delCx('${c.id}')">حذف</button></div></div>`).join('')+`<div class="card"><h2>كلمة مرور المشرف العام</h2><input id="gp" placeholder="كلمة جديدة"><button onclick="if(V('gp')){DB.gp=V('gp');fs.doc('meta/main').set({gp:DB.gp});alert('تم')}">تغيير</button></div>`}
function addCx(){if(!V('n').trim())return;const c=newCx(V('n').trim(),V('w'),V('p'));fs.collection('cx').doc(c.id).set(strip(c)).then(R)}
function delCx(i){if(confirm('حذف المجمع وكل بياناته؟')){fs.collection('cx').doc(i).delete().then(()=>{DB.cx=DB.cx.filter(c=>c.id!=i);R()})}}
/* SUPERVISOR */
function vSup(){const c=C();const T=[['st','الطلاب'],['ms','الرسائل'],['rp','التقارير'],['se','الإعدادات']];
return tp('مجمع '+c.name)+`<div class="tabs np">${T.map(([k,n])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';R()">${n}</button>`).join('')}</div>`+({st:tStu,ms:tMsg,rp:tRep,se:tSet}[S.tab])(c)}
function hsel(c,v,id,all){return`<select id="${id}" ${id.startsWith('m_')?'':''}>${all?'<option value="">كل الحلقات</option>':''}${c.halaqat.map(h=>`<option value="${h.id}"${h.id==v?' selected':''}>${E(h.name)}</option>`).join('')}</select>`}
function tStu(c){if(!c.halaqat.length)return'<div class="card">أضف حلقة أولاً من «الإعدادات».</div>';
return`<div class="card"><h2>تسجيل طالب</h2><input id="sn" placeholder="اسم الطالب"><input id="sp" placeholder="جوال ولي الأمر" inputmode="tel">${hsel(c,'','sh')}<div class="row"><div><span class="mu">يبدأ من سورة</span><select id="s1">${SO(1)}</select></div><div><span class="mu">إلى سورة</span><select id="s2">${SO(113)}</select></div></div><button onclick="addSt()">تسجيل</button></div>`+
c.halaqat.map(h=>`<div class="card"><h3>${E(h.name)} <span class="mu">${E(h.teacher||'')}</span></h3>${c.students.filter(s=>s.h==h.id).map(s=>`<div class="st"><b>${E(s.name)}</b> <span class="pill">${SN[s.s]} آية ${s.a}</span><div class="row"><div><span class="mu">نقل إلى حلقة</span><select onchange="mvH('${s.id}',this.value)">${c.halaqat.map(x=>`<option value="${x.id}"${x.id==s.h?' selected':''}>${E(x.name)}</option>`).join('')}</select></div><div><span class="mu">نقل إلى سورة</span><select onchange="mvS('${s.id}',this.value)">${SO(s.s,Math.min(s.s0,s.e),113)}</select></div></div></div>`).join('')||'<p class="mu">لا طلاب</p>'}</div>`).join('')}
function addSt(){const c=C();if(!V('sn').trim())return alert('اكتب الاسم');const a=+V('s1'),b=+V('s2');c.students.push({id:uid(),name:V('sn').trim(),ph:V('sp'),h:V('sh'),s0:a,e:b,s:a,a:1});save();R()}
function mvH(i,h){C().students.find(s=>s.id==i).h=h;save();R()}
function mvS(i,v){const s=C().students.find(s=>s.id==i);s.s=+v;s.a=1;save();R()}
function msgFill(t,o){return t.replace(/\{(.+?)\}/g,(m,k)=>o[k]??m)}
function tMsg(c){const sel=c.students.map(s=>`<label class="ck"><input type="checkbox" class="ms" value="${s.id}"><span>${E(s.name)} <span class="mu">${E((c.halaqat.find(h=>h.id==s.h)||{}).name||'')}</span></span></label>`).join('');
return`<div class="card"><h2>رسالة عامة</h2><p class="mu">رقم واتساب المجمع: ${E(c.wa||'غير مربوط')}</p><textarea id="mt" placeholder="نص الرسالة"></textarea><label class="ck"><input type="checkbox" onchange="document.querySelectorAll('.ms').forEach(x=>x.checked=this.checked)"><b>تحديد الكل</b></label>${sel||'<p class="mu">لا طلاب</p>'}<button onclick="qMsg()">إضافة إلى الصادر</button></div>`+outbox(c)}
function qMsg(){const c=C(),t=V('mt').trim(),ids=[...document.querySelectorAll('.ms:checked')].map(x=>x.value);if(!t||!ids.length)return alert('اكتب الرسالة وحدد الطلاب');
ids.forEach(i=>{const s=c.students.find(x=>x.id==i);addOut(c,{id:uid(),to:s.name,ph:s.ph,text:t,d:today()})});R()}
function outbox(c){return`<div class="card"><h2>الصادر (${c.out.length})</h2>${c.out.slice(0,60).map(m=>`<div class="st"><b>${E(m.to)}</b> <span class="mu">${m.d}</span><div class="mu" style="white-space:pre-wrap">${E(m.text)}</div><a class="w" target="_blank" rel="noopener" href="https://wa.me/${ph(m.ph)}?text=${encodeURIComponent(m.text)}">إرسال واتساب</a></div>`).join('')||'<p class="mu">فارغ</p>'}${c.out.length?`<button class="o s" style="margin-top:8px" onclick="if(confirm('مسح الصادر؟')){C().out.forEach(m=>fs.collection('out').doc(m.ref).delete())}">مسح</button>`:''}</div>`}
/* REPORTS */
function tRep(c){const r=S.rp||{f:today(),t:today(),h:'',d:true};
return`<div class="card np"><h2>تقرير</h2><div class="row"><div><span class="mu">من</span><input id="rf" type="date" value="${r.f}"></div><div><span class="mu">إلى</span><input id="rt" type="date" value="${r.t}"></div></div>${hsel(c,r.h,'rh',true)}<label class="ck"><input id="rd" type="checkbox" ${r.d?'checked':''}>تفصيل كل تسميع</label><button onclick="S.rp={f:V('rf'),t:V('rt'),h:V('rh'),d:$('rd').checked};R()">عرض</button> <button class="o" onclick="print()">طباعة</button></div>`+(S.rp?repOut(c,S.rp):'')}
function repOut(c,r){const sc=scale(c),gv=l=>{const x=sc.find(y=>y.l==l);return x?x.v:parseFloat(l)};
const L=c.logs.filter(l=>l.d>=r.f&&l.d<=r.t&&(!r.h||l.h==r.h));const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'-';
const sts=c.students.filter(s=>!r.h||s.h==r.h);let h=`<div class="card"><h2>تقرير ${r.h?E(c.halaqat.find(x=>x.id==r.h).name):'المجمع كامله'}</h2><p class="mu">${r.f} إلى ${r.t}</p><div class="tw"><table><tr><th>الطالب</th>${c.methods.map(m=>`<th>${E(m)}</th>`).join('')}<th>مجموع الوجوه</th><th>متوسط الدرجات</th><th>غياب</th></tr>`;
const hs={};
sts.forEach(s=>{const ls=L.filter(l=>l.sid==s.id);const g=ls.filter(l=>l.g!=null).map(l=>l.g);g.forEach(x=>(hs[s.h]=hs[s.h]||[]).push(x));
h+=`<tr><td>${E(s.name)}</td>${c.methods.map(m=>`<td>${ls.filter(l=>l.m==m).reduce((a,l)=>a+l.f,0)}</td>`).join('')}<td><b>${ls.reduce((a,l)=>a+(l.f||0),0)}</b></td><td>${avg(g)}</td><td>${ls.filter(l=>l.st=='a').length}</td></tr>`});
h+=`</table></div><p><b>متوسط الحلقات:</b> ${c.halaqat.filter(x=>hs[x.id]).map(x=>E(x.name)+': '+avg(hs[x.id])).join(' | ')||'-'}</p><p><b>مجموع وجوه المجمع/الحلقة:</b> ${L.reduce((a,l)=>a+(l.f||0),0)}</p></div>`;
if(r.d)h+=`<div class="card"><h2>التفصيل اليومي</h2><div class="tw"><table><tr><th>التاريخ</th><th>الطالب</th><th>النوع</th><th>التسميع</th><th>الوجوه</th><th>التقييم</th></tr>${L.sort((a,b)=>a.d<b.d?-1:1).map(l=>{const s=c.students.find(x=>x.id==l.sid);return`<tr><td>${l.d}</td><td>${E(s?s.name:'-')}</td><td>${l.st=='a'?'غائب':l.st=='n'?'حاضر بلا تسميع':E(l.m)}</td><td>${l.st=='r'?SN[l.s]+' '+l.a1+'-'+l.a2:'-'}</td><td>${l.f||0}</td><td>${E(l.ev||'-')}</td></tr>`}).join('')}</table></div></div>`;return h}
/* SETTINGS */
function tSet(c){return`<div class="card"><h2>الحلقات</h2>${c.halaqat.map(h=>`<div class="st">${E(h.name)} - ${E(h.teacher||'')} <span class="mu">(سر: ${E(h.pass)})</span> <button class="s d" onclick="delH('${h.id}')">حذف</button></div>`).join('')}<input id="hn" placeholder="اسم الحلقة"><input id="ht" placeholder="اسم المعلم"><input id="hp" placeholder="كلمة مرور المعلم (افتراضي 1111)"><button onclick="addH()">إضافة حلقة</button></div>
<div class="card"><h2>طريقة التقييم</h2><p class="mu">سطر لكل تقدير بصيغة «الاسم:الدرجة». مثال: ممتاز:100 أو 10:10 أو 9:9</p><textarea id="sc">${E(c.scale)}</textarea><h2>طرق التسميع</h2><p class="mu">افصل بينها بفاصلة</p><input id="me" value="${E(c.methods.join('،'))}"></div>
<div class="card"><h2>نصوص الرسائل</h2><p class="mu">المتغيرات: {الطالب} {التقييم} {السورة} {الوجوه} {النوع} {الحلقة}</p><span class="mu">عند التسميع</span><textarea id="t1">${E(c.t1)}</textarea><span class="mu">حاضر ولم يسمّع</span><textarea id="t2">${E(c.t2)}</textarea><span class="mu">غائب</span><textarea id="t3">${E(c.t3)}</textarea></div>
<div class="card"><h2>واتساب المجمع وكلمة المرور</h2><input id="wa" value="${E(c.wa)}" placeholder="رقم واتساب المجمع"><input id="cp" value="${E(c.pass)}" placeholder="كلمة مرور المشرف"><button onclick="saveSet()">حفظ الإعدادات</button></div>`}
function delH(i){const c=C(),n=c.students.filter(s=>s.h==i).length;if(n)return alert('في الحلقة '+n+' طالب. انقلهم إلى حلقة أخرى أولاً من تبويب الطلاب.');if(confirm('حذف الحلقة؟')){c.halaqat=c.halaqat.filter(h=>h.id!=i);save();R()}}
function addH(){const c=C();if(!V('hn').trim())return;c.halaqat.push({id:uid(),name:V('hn').trim(),teacher:V('ht'),pass:V('hp')||'1111'});save();R()}
function saveSet(){const c=C();c.scale=V('sc');c.methods=V('me').split(/[,،\n]/).map(x=>x.trim()).filter(Boolean);c.t1=V('t1');c.t2=V('t2');c.t3=V('t3');c.wa=V('wa');c.pass=V('cp')||'1111';save();alert('تم الحفظ')}
/* TEACHER */
function vTea(){const c=C(),h=c.halaqat.find(x=>x.id==S.hid),sc=scale(c);
return tp('حلقة '+h.name)+`<p class="mu">${today()} — تظهر لكل طالب السور من آخر موضع وصل إليه حتى سورة النهاية.</p>`+c.students.filter(s=>s.h==h.id).map(s=>`<div class="card" id="c_${s.id}"><b>${E(s.name)}</b> <span class="pill">آخر موضع: ${SN[s.s]} ${s.a}</span><select id="st_${s.id}" onchange="tg('${s.id}')"><option value="r">حاضر وسمّع</option><option value="n">حاضر ولم يسمّع</option><option value="a">غائب</option></select><div id="f_${s.id}"><select id="m_${s.id}">${c.methods.map(m=>`<option>${E(m)}</option>`).join('')}</select><div class="row"><div><span class="mu">السورة</span><select id="s_${s.id}" onchange="sa('${s.id}')">${SO(s.s,s.s,Math.max(s.e,s.s))}</select></div><div><span class="mu">من آية</span><input id="a1_${s.id}" type="number" min="1" value="${s.a}"></div><div><span class="mu">إلى آية</span><input id="a2_${s.id}" type="number" min="1" value="${Math.min(s.a+9,AC[s.s])}"></div><div><span class="mu">عدد الوجوه</span><input id="fc_${s.id}" type="number" min="0" step="0.5" value="1"></div></div><select id="ev_${s.id}">${sc.map(x=>`<option>${E(x.l)}</option>`).join('')}</select><button class="o s" style="margin-top:6px" onclick="showAy('${s.id}')">عرض الآيات</button><div id="ay_${s.id}"></div></div></div>`).join('')+`<button class="np" style="width:100%" onclick="saveEv()">حفظ التقييم وإرسال الرسائل لأولياء الأمور</button>`}
const QC={},AD=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
async function getJ(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);try{const x=await fetch(u,{signal:c.signal});if(!x.ok)throw new Error('HTTP '+x.status);return await x.json()}finally{clearTimeout(t)}}
const nb=t=>t.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/\u0671/g,'ا');
function nobism(t,n){if(n>1&&n!=9&&nb(t).startsWith('بسم الله الرحمن الرحيم '))return t.split(' ').slice(4).join(' ');return t}
async function loadSurah(n){if(QC[n])return QC[n];try{const j=JSON.parse(localStorage.getItem('q3_'+n));if(j&&j.r&&j.r.length==AC[n]){QC[n]=j;return j}}catch(e){}
let r=null,src='';const why=[],c=n+1;
const ok=t=>t.length==AC[n]&&t.every(x=>typeof x=='string'&&x.length);
try{const d=await getJ('https://api.quran.com/api/v4/quran/verses/qpc_hafs?chapter_number='+c);const t=(d.verses||[]).map(v=>v.text_qpc_hafs||v.text_uthmani||v.text);if(ok(t)){r=t;src='مجمع الملك فهد (QPC Hafs)'}else why.push('A:'+t.length)}catch(e){why.push('A:'+(e.message||e))}
if(!r){try{const d=await getJ('https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/chapters/'+c+'.json');const t=d.verses.map((v,k)=>k?v.text:nobism(v.text,c));if(ok(t)){r=t;src='موسوعة القرآن (QuranEnc) - مصدر احتياطي'}else why.push('B:'+t.length)}catch(e){why.push('B:'+(e.message||e))}}
if(!r){try{const d=await getJ('https://api.alquran.cloud/v1/surah/'+c+'/quran-uthmani');const t=d.data.ayahs.map((a,k)=>k?a.text:nobism(a.text,c));if(ok(t)){r=t;src='نص عثماني (مصدر احتياطي)'}else why.push('C:'+t.length)}catch(e){why.push('C:'+(e.message||e))}}
if(!r)throw new Error(why.join(' | '));const o={r,src};QC[n]=o;try{localStorage.setItem('q3_'+n,JSON.stringify(o))}catch(e){}return o}
async function showAy(i){const b=$('ay_'+i);if(b.innerHTML){b.innerHTML='';return}
const st=C().students.find(x=>x.id==i),n=+V('s_'+i);let a1=+V('a1_'+i)||1,a2=+V('a2_'+i)||a1;if(n==st.s)a1=Math.max(a1,st.a);a2=Math.min(Math.max(a2,a1),AC[n]);
b.innerHTML='<p class="mu">جارٍ التحميل…</p>';
try{const o=await loadSurah(n);b.innerHTML=`<div class="ay" dir="rtl">${o.r.slice(a1-1,a2).map((t,k)=>`${E(t)} <b>﴿${AD(a1+k)}﴾</b>`).join(' ')}</div><p class="mu">${SN[n]} (${a1}–${a2}) — المصدر: ${o.src}</p>`}catch(e){b.innerHTML='<p class="mu">تعذر تحميل النص ('+E(e.message||'')+')</p>'}}
function tg(i){$('f_'+i).style.display=V('st_'+i)=='r'?'':'none'}
function sa(i){$('ay_'+i).innerHTML='';const s=+V('s_'+i);$('a2_'+i).max=AC[s];$('a1_'+i).max=AC[s]}
function saveEv(){const c=C(),sc=scale(c),h=c.halaqat.find(x=>x.id==S.hid);let n=0;
c.students.filter(s=>s.h==h.id).forEach(s=>{const st=V('st_'+s.id)||'r';const l={id:uid(),d:today(),sid:s.id,h:h.id,st};let t=c.t1;
if(st=='r'){l.m=V('m_'+s.id);l.s=+V('s_'+s.id);l.a1=+V('a1_'+s.id);l.a2=Math.min(+V('a2_'+s.id)||l.a1,AC[l.s]);l.f=parseFloat(V('fc_'+s.id))||0;l.ev=V('ev_'+s.id);const x=sc.find(y=>y.l==l.ev);l.g=x?x.v:null;
s.s=l.s;s.a=l.a2+1;if(s.a>AC[s.s]&&s.s<s.e){s.s++;s.a=1}}else t=st=='n'?c.t2:c.t3;
fs.collection('logs').add({...l,cid:c.id});const text=msgFill(t,{'الطالب':s.name,'التقييم':l.ev||'','السورة':l.s!=null?SN[l.s]+' '+l.a1+'-'+l.a2:'','الوجوه':l.f||0,'النوع':l.m||'','الحلقة':h.name});
addOut(c,{id:uid(),to:s.name,ph:s.ph,text,d:today()});n++});save();alert('تم حفظ '+n+' تقييم وجُهزت رسائل أولياء الأمور في الصادر')}
if(OK)R();else $('app').innerHTML='<div class="card"><h2>الإعداد</h2><p>الصق إعدادات Firebase في الثابت FB أعلى الملف.</p></div>';
</script></body></html>
