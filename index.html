<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>ترتيل</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5a46"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri+Quran&display=swap" rel="stylesheet"><style>
:root{--bg:#f2f0e8;--card:#fff;--tx:#18261f;--mu:#667a70;--pr:#1f5c3d;--pr2:#2b7a53;--go:#b8962e;--bd:#e2decf;--in:#f7f5ee;--dg:#b3382c;--sh:0 1px 2px rgba(20,40,30,.06),0 10px 26px -14px rgba(20,40,30,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1713;--card:#15241d;--tx:#e8efe9;--mu:#9bb0a5;--pr:#3aa77c;--pr2:#4cc093;--go:#d9b648;--bd:#26382f;--in:#0f1c16;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(900px 340px at 50% -80px,color-mix(in srgb,var(--pr) 14%,transparent),transparent);background-repeat:no-repeat;color:var(--tx);font-family:Tajawal,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:auto;padding:12px 14px 120px;animation:fi .5s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fff 0%,#f6f3e8 55%,#e9efe6 100%);transition:opacity .6s ease,visibility .6s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
.sp-in{text-align:center;padding:24px;width:min(360px,88vw)}
.sp-in img{width:100%;height:auto;display:block;animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
.sp-t{font-size:44px;font-weight:800;color:#1f5c3d;margin-top:18px;animation:fi .9s .35s ease both}
.sp-s{color:#6b7a70;font-size:15px;animation:fi .9s .5s ease both}
.sp-bar{height:4px;background:#e2decf;border-radius:4px;overflow:hidden;margin:26px auto 0;width:140px}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1f5c3d,#b8962e);animation:ld 2.1s ease forwards}
@keyframes ld{to{width:100%}}@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
/* hero */
.hero{text-align:center;padding:22px 0 10px}
.hero .brand{display:block;width:min(250px,72%);height:auto;margin:0 auto 12px;background:#fff;border:1px solid var(--bd);border-radius:22px;padding:12px 16px;box-shadow:var(--sh)}
.hero h1{margin:6px 0 0;font-size:38px;font-weight:800;color:var(--pr);letter-spacing:.5px}
.hero h1:after{content:"";display:block;width:54px;height:3px;border-radius:3px;background:var(--go);margin:4px auto 0}
.hero p{margin:8px 0 0;color:var(--mu);font-size:15px}
.foot{text-align:center;color:var(--mu);font-size:12.5px;margin:26px 0 0}
/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
h2{font-size:18px;font-weight:800;margin:0 0 10px;color:var(--pr);padding-inline-start:10px;border-inline-start:4px solid var(--go);line-height:1.3}
h3{font-size:16px;margin:0 0 6px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:var(--in);border:1.5px solid var(--bd);border-radius:12px;padding:10px 13px;margin:4px 0;font-size:16px;min-height:50px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 18%,transparent)}
textarea{min-height:80px}
button{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;min-height:48px;font-weight:700;font-size:16px;box-shadow:0 6px 14px -8px var(--pr);transition:transform .1s,filter .15s}
button:active{transform:scale(.97)}button:hover{filter:brightness(1.06)}
button.o{background:none;color:var(--pr);border:1.5px solid var(--pr);box-shadow:none}
button.d{background:var(--dg);box-shadow:none}button.s{padding:5px 12px;font-size:14px;min-height:40px}
button:disabled{opacity:.55;cursor:default}
/* login seg */
.seg{display:flex;gap:4px;background:var(--in);border:1px solid var(--bd);padding:4px;border-radius:15px}
.seg button{flex:1;background:none;color:var(--mu);border:0;box-shadow:none;line-height:1.3;min-height:44px}
.seg button.on{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;box-shadow:0 6px 14px -8px var(--pr)}
.seg small{font-weight:400}
/* header */
.top{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;border-radius:18px;padding:10px 14px;margin-top:8px;position:sticky;top:6px;z-index:6;box-shadow:var(--sh)}
.top b{flex:1;font-size:17px}.top button{background:#ffffff26;box-shadow:none;padding:5px 12px;min-height:40px;font-size:14px}
/* bottom nav */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);z-index:5;margin:0;display:flex;gap:2px;background:var(--card);border:1px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px -16px rgba(0,0,0,.35)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mu);box-shadow:none;font-size:12px;font-weight:700;min-height:54px;padding:6px 2px;border-radius:14px;white-space:nowrap}
.tabs button.on{background:color-mix(in srgb,var(--pr) 13%,transparent);color:var(--pr)}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.mu{color:var(--mu);font-size:13.5px}.ck{display:flex;gap:10px;align-items:center;padding:4px 0}.ck input{width:20px;height:20px;min-height:0;flex:none;accent-color:var(--pr)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid var(--bd);padding:6px;text-align:center}th{background:var(--in);color:var(--pr)}
.st{border-top:1px dashed var(--bd);padding:10px 0}.card.st{border-top:1px solid var(--bd)}
.pill{display:inline-block;background:var(--in);border:1px solid var(--bd);border-radius:20px;padding:1px 11px;font-size:12.5px;color:var(--mu)}
.pill.ok{background:var(--pr);color:#fff;border-color:var(--pr)}
a.w{display:inline-block;background:#1fa855;color:#fff;border-radius:10px;padding:6px 14px;text-decoration:none;font-size:14px;font-weight:700}
.ay{font-family:"KFGQPC HAFS Uthmanic Script","Amiri Quran",serif;font-size:24px;line-height:2.3;text-align:justify;background:var(--in);border-radius:14px;padding:12px;margin:6px 0}.ay b{color:var(--go);font-size:17px}
.th{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.th b{font-size:18px}
.bar{height:9px;background:var(--in);border:1px solid var(--bd);border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr2),var(--go));border-radius:9px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.seg3 button{background:var(--in);color:var(--tx);border:2px solid var(--bd);padding:6px;box-shadow:none;line-height:1.3}
.seg3 button.on[data-k=r]{background:var(--pr);border-color:var(--pr);color:#fff}.seg3 button.on[data-k=n]{background:var(--go);border-color:var(--go);color:#222}.seg3 button.on[data-k=a]{background:var(--dg);border-color:var(--dg);color:#fff}
.frm{background:var(--in);border:2px dashed var(--go);border-radius:14px;padding:10px 14px;margin:6px 0}.frm .big{display:block;font-size:20px;color:var(--pr)}
.stp{display:flex;gap:6px}.stp input{text-align:center;font-size:20px;font-weight:700;margin:4px 0}.stp button{width:52px;flex:none;padding:0;font-size:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.chips button{background:var(--in);color:var(--tx);border:2px solid var(--bd);min-height:44px;padding:6px 15px;box-shadow:none}.chips button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.tc[data-k]{border:2px solid var(--pr)}.tc[data-k=a]{opacity:.85}
.cu{border:1.5px solid var(--bd);border-radius:16px;padding:10px 12px;margin:10px 0;background:var(--card)}
.cu:not(.off){border-color:var(--pr);background:color-mix(in srgb,var(--pr) 4%,var(--card))}
.cuh{display:flex;gap:10px;align-items:center;cursor:pointer;min-height:36px}.cuh b{font-size:17px;color:var(--pr)}.cuh input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--pr);margin:0}
.sv{position:sticky;bottom:96px;width:100%;min-height:58px;font-size:18px;box-shadow:0 10px 24px -8px var(--pr)}.sv:disabled{background:var(--mu);box-shadow:none}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--pr);color:#fff;padding:12px 22px;border-radius:14px;z-index:90;font-weight:700;box-shadow:0 10px 26px -8px #0008}
summary{cursor:pointer;color:var(--pr);font-weight:700;padding:10px 0;min-height:44px}
.ay b.sn{display:block;text-align:center;font-size:15px}
.mush{max-height:55vh;overflow:auto}.v{cursor:pointer;border-radius:6px;padding:2px 0}.v.sel{background:#b8962e40}.v.end{background:var(--go);color:#222}.v.end b{color:#222}
.fc{text-align:center;color:var(--mu);font-size:13px;border-top:1px dashed var(--bd);margin:8px 0;padding-top:4px}
@media print{body{background:#fff;color:#000}.top,.tabs,.np,#splash{display:none!important}.card{border:0;box-shadow:none}}

try{const d=await getJ('https://api.quran.com/api/v4/quran/verses/qpc_hafs?chapter_number='+c);const t=(d.verses||[]).map(v=>v.text_qpc_hafs||v.text_uthmani||v.text);if(ok(t)){r=t;src='مجمع الملك فهد (QPC Hafs)'}else why.push('A:'+t.length)}catch(e){why.push('A:'+(e.message||e))}

const OKV=/^[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF\u200c\u200d\s]+$/,PK={},FACE=660,cl=t=>t.replace(/[\s\u06DD\uFD3E\uFD3F]*[\u0660-\u0669\u06F0-\u06F90-9]+\s*$/,"");

async function more(q){const st=SM(q).u,p=PK[q],box=$('mu_'+q),btn=$('mb_'+q),d=dirOf(st);if(!p||p.fin)return;
