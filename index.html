<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>ترتيل</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5a46"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri+Quran&display=swap" rel="stylesheet"><style>
:root{--bg:#f2f0e8;--card:#fff;--tx:#18261f;--mu:#667a70;--pr:#1f5c3d;--pr2:#2b7a53;--go:#b8962e;--bd:#e2decf;--in:#f7f5ee;--dg:#b3382c;--sh:0 1px 2px rgba(20,40,30,.06),0 10px 26px -14px rgba(20,40,30,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1713;--card:#15241d;--tx:#e8efe9;--mu:#9bb0a5;--pr:#3aa77c;--pr2:#4cc093;--go:#d9b648;--bd:#26382f;--in:#0f1c16;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(900px 340px at 50% -80px,color-mix(in srgb,var(--pr) 14%,transparent),transparent);background-repeat:no-repeat;color:var(--tx);font-family:Tajawal,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:auto;padding:12px 14px 120px}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fff 0%,#f6f3e8 55%,#e9efe6 100%);transition:opacity .6s ease,visibility .6s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
.sp-in{text-align:center;padding:24px;width:min(360px,88vw)}
.sp-in img{width:100%;height:auto;display:block;animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
.sp-t{font-size:44px;font-weight:800;color:#1f5c3d;margin-top:18px;animation:fi .9s .35s ease both}
.sp-s{color:#6b7a70;font-size:15px;animation:fi .9s .5s ease both}
.sp-bar{height:4px;background:#e2decf;border-radius:4px;overflow:hidden;margin:26px auto 0;width:140px}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1f5c3d,#b8962e);animation:ld 2.1s ease forwards}
@keyframes ld{to{width:100%}}@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
/* hero */
.hero{text-align:center;padding:22px 0 10px}
.hero .brand{display:block;width:min(300px,82%);height:auto;margin:0 auto 12px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .brand{background:#f6f3e8;border-radius:22px;padding:12px 16px}}
.hero h1{margin:6px 0 0;font-size:38px;font-weight:800;color:var(--pr);letter-spacing:.5px}
.hero h1:after{content:"";display:block;width:54px;height:3px;border-radius:3px;background:var(--go);margin:4px auto 0}
.hero p{margin:8px 0 0;color:var(--mu);font-size:15px}
.foot{text-align:center;color:var(--mu);font-size:12.5px;margin:26px 0 0}
/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
h2{font-size:18px;font-weight:800;margin:0 0 10px;color:var(--pr);padding-inline-start:10px;border-inline-start:4px solid var(--go);line-height:1.3}
h3{font-size:16px;margin:0 0 6px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:var(--in);border:1.5px solid var(--bd);border-radius:12px;padding:10px 13px;margin:4px 0;font-size:16px;min-height:50px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 18%,transparent)}
textarea{min-height:80px}
button{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;min-height:48px;font-weight:700;font-size:16px;box-shadow:0 6px 14px -8px var(--pr);transition:transform .1s,filter .15s}
button:active{transform:scale(.97)}button:hover{filter:brightness(1.06)}
button.o{background:none;color:var(--pr);border:1.5px solid var(--pr);box-shadow:none}
button.d{background:var(--dg);box-shadow:none}button.s{padding:5px 12px;font-size:14px;min-height:40px}
button:disabled{opacity:.55;cursor:default}
/* login seg */
.seg{display:flex;gap:4px;background:var(--in);border:1px solid var(--bd);padding:4px;border-radius:15px}
.seg button{flex:1;background:none;color:var(--mu);border:0;box-shadow:none;line-height:1.3;min-height:44px}
.seg button.on{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;box-shadow:0 6px 14px -8px var(--pr)}
.seg small{font-weight:400}
/* header */
.top{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;border-radius:18px;padding:10px 14px;margin-top:8px;position:sticky;top:6px;z-index:6;box-shadow:var(--sh)}
.top b{flex:1;font-size:17px}.top button{background:#ffffff26;box-shadow:none;padding:5px 12px;min-height:40px;font-size:14px}
/* bottom nav */
.tabs{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:min(100%,760px);z-index:5;display:flex;gap:2px;background:var(--card);border:1px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px -16px rgba(0,0,0,.35)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mu);box-shadow:none;font-size:12px;font-weight:700;min-height:54px;padding:6px 2px;border-radius:14px;white-space:nowrap}
.tabs button.on{background:color-mix(in srgb,var(--pr) 13%,transparent);color:var(--pr)}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.mu{color:var(--mu);font-size:13.5px}.ck{display:flex;gap:10px;align-items:center;padding:4px 0}.ck input{width:20px;height:20px;min-height:0;flex:none;accent-color:var(--pr)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid var(--bd);padding:6px;text-align:center}th{background:var(--in);color:var(--pr)}
.st{border-top:1px dashed var(--bd);padding:10px 0}.card.st{border-top:1px solid var(--bd)}
.pill{display:inline-block;background:var(--in);border:1px solid var(--bd);border-radius:20px;padding:1px 11px;font-size:12.5px;color:var(--mu)}
.pill.ok{background:var(--pr);color:#fff;border-color:var(--pr)}
a.w{display:inline-block;background:#1fa855;color:#fff;border-radius:10px;padding:6px 14px;text-decoration:none;font-size:14px;font-weight:700}
.ay{font-family:"KFGQPC HAFS Uthmanic Script","Amiri Quran",serif;font-size:24px;line-height:2.3;text-align:justify;background:var(--in);border-radius:14px;padding:12px;margin:6px 0}.ay b{color:var(--go);font-size:17px}
.th{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.th b{font-size:18px}
.bar{height:9px;background:var(--in);border:1px solid var(--bd);border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr2),var(--go));border-radius:9px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.seg3 button{background:var(--in);color:var(--tx);border:2px solid var(--bd);padding:6px;box-shadow:none;line-height:1.3}
.seg3 button.on[data-k=r]{background:var(--pr);border-color:var(--pr);color:#fff}.seg3 button.on[data-k=n]{background:var(--go);border-color:var(--go);color:#222}.seg3 button.on[data-k=a]{background:var(--dg);border-color:var(--dg);color:#fff}
.frm{background:var(--in);border:2px dashed var(--go);border-radius:14px;padding:10px 14px;margin:6px 0}.frm .big{display:block;font-size:20px;color:var(--pr)}
.stp{display:flex;gap:6px}.stp input{text-align:center;font-size:20px;font-weight:700;margin:4px 0}.stp button{width:52px;flex:none;padding:0;font-size:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.chips button{background:var(--in);color:var(--tx);border:2px solid var(--bd);min-height:44px;padding:6px 15px;box-shadow:none}.chips button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.tc[data-k]{border:2px solid var(--pr)}.tc[data-k=a]{opacity:.85}
.cu{border:1.5px solid var(--bd);border-radius:16px;padding:10px 12px;margin:10px 0;background:var(--card)}
.cu:not(.off){border-color:var(--pr);background:color-mix(in srgb,var(--pr) 4%,var(--card))}
.cuh{display:flex;gap:10px;align-items:center;cursor:pointer;min-height:36px}.cuh b{font-size:17px;color:var(--pr)}.cuh input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--pr);margin:0}
.sv{position:sticky;bottom:96px;width:100%;min-height:58px;font-size:18px;box-shadow:0 10px 24px -8px var(--pr)}.sv:disabled{background:var(--mu);box-shadow:none}
.toast{position:fixed;top:16px;left:0;right:0;margin:0 auto;width:max-content;max-width:90vw;background:var(--pr);color:#fff;padding:12px 22px;border-radius:14px;z-index:90;font-weight:700;box-shadow:0 10px 26px -8px #0008}
summary{cursor:pointer;color:var(--pr);font-weight:700;padding:10px 0;min-height:44px}
.ay b.sn{display:block;text-align:center;font-size:15px}
.mush{max-height:55vh;overflow:auto}.v{cursor:pointer;border-radius:6px;padding:2px 0}.v.sel{background:#b8962e40}.v.end{background:var(--go);color:#222}.v.end b{color:#222}
.fc{text-align:center;color:var(--mu);font-size:13px;border-top:1px dashed var(--bd);margin:8px 0;padding-top:4px}
@media print{body{background:#fff;color:#000}.top,.tabs,.np,#splash{display:none!important}.card{border:0;box-shadow:none}}

function hsel(c,v,id,all){return`<select id="${id}" ${id.startsWith('m_')?'':''}>${all?'<option value="">كل الحلقات</option>':''}${c.halaqat.map(h=>`<option value="${h.id}"${h.id==v?' selected':''}>${E(h.name)}</option>`).join('')}</select>`}
function tStu(c){if(!c.halaqat.length)return'<div class="card">أضف حلقة أولاً من «الإعدادات».</div>';
const cf=(p,n)=>`<b>${n}</b><span class="mu">من سورة ← إلى سورة</span><div class="row"><select id="${p}f">${SO(0)}</select><select id="${p}t">${SO(113)}</select></div>`;
return`<div class="card"><h2>تسجيل طالب جديد</h2><input id="sn" placeholder="اسم الطالب"><input id="sp" placeholder="جوال ولي الأمر" inputmode="tel">${hsel(c,'','sh')}${cf('h1','منهج الحفظ')}${cf('r1','منهج المراجعة')}<button style="width:100%;margin-top:8px" onclick="addSt()">تسجيل الطالب</button></div>`}
function addSt(){const c=C();if(!V('sn').trim())return alert('اكتب اسم الطالب');c.students.push({id:uid(),name:V('sn').trim(),ph:V('sp'),h:V('sh'),cu:{'حفظ':mkCu(+V('h1f'),+V('h1t')),'مراجعة':mkCu(+V('r1f'),+V('r1t'))}});save();toast('تم تسجيل الطالب');R()}
function tHal(c){const h=c.halaqat.find(x=>x.id==S.vh);
if(!h)return c.halaqat.map(x=>`<div class="card" style="cursor:pointer" onclick="S.vh='${x.id}';R()"><h3>${E(x.name)} <span class="mu">${E(x.teacher||'')}</span></h3><div class="mu">${c.students.filter(s=>s.h==x.id).length} طالب ◂</div></div>`).join('')||'<div class="card">أضف حلقة من «الإعدادات».</div>';
return`<button class="o np" onclick="S.vh=null;R()">▸ كل الحلقات</button><h2>${E(h.name)} <span class="mu">${E(h.teacher||'')}</span></h2>`+(c.students.filter(s=>s.h==h.id).map(s=>stCard(c,s)).join('')||'<p class="mu">لا طلاب في هذه الحلقة</p>')}
function stCard(c,s){const K=CK(s),ks=Object.keys(K);
return`<div class="card st"><div class="th"><b>${E(s.name)}</b><span class="pill${allFin(s)?' ok':''}">${allFin(s)?'أتمّ المناهج':'نشط'}</span></div>`+ks.map(k=>{const u=K[k];return`<div class="mu">${E(k)}: ${SN[u.s0]} ← ${SN[u.e]} · ${fin(u)?'أتمّ':SN[u.s]+' آية '+u.a}</div>${bar(u)}`}).join('')+`<div class="row np" style="margin:8px 0"><button type="button" class="o s" onclick="stLink('${s.id}','c')">🔗 نسخ الرابط</button><button type="button" class="o s" onclick="stLink('${s.id}','s')">↗ مشاركة</button><button type="button" class="o s" onclick="stLink('${s.id}','w')">واتساب</button></div><details><summary>إضافة تسميع للطالب</summary>${tcard(c,s,scale(c),1)}</details><details><summary>تعديل بيانات الطالب ونقله ومناهجه</summary><span class="mu">اسم الطالب</span><input id="en_${s.id}" value="${E(s.name)}"><span class="mu">جوال ولي الأمر</span><input id="ep_${s.id}" value="${E(s.ph||'')}" inputmode="tel"><button class="o" style="width:100%" onclick="saveInfo('${s.id}')">حفظ البيانات</button><span class="mu">نقل إلى حلقة</span><select onchange="mvH('${s.id}',this.value)">${c.halaqat.map(x=>`<option value="${x.id}"${x.id==s.h?' selected':''}>${E(x.name)}</option>`).join('')}</select>${ks.map((k,j)=>cuEd(s,j)).join('')}<b>إضافة منهج جديد</b><input id="nk_${s.id}" placeholder="اسم المنهج (مثال: تثبيت)"><div class="row"><select id="nf_${s.id}">${SO(0)}</select><select id="nt_${s.id}">${SO(113)}</select></div><button class="o" style="width:100%" onclick="addCu('${s.id}')">إضافة منهج</button><button type="button" class="d" style="width:100%;margin-top:14px" onclick="delSt('${s.id}')">🗑 حذف الطالب</button></details></div>`}
function stLinkMsg(s){return'السلام عليكم ولي أمر الطالب '+s.name+'\nهذا رابطكم الخاص لمتابعة نتيجة ابنكم يومياً (التسميع والتقييم والحضور) دون الحاجة لأي رسائل:\n'+plink(s)+'\nيُنصح بحفظ الرابط وإضافته للشاشة الرئيسية.'}
function stLink(i,m){const c=C(),s=c.students.find(x=>x.id==i);if(!s)return;pubRoot(c,s);save();const t=stLinkMsg(s);
if(m=='w'){if(!ph(s.ph))return alert('لا يوجد رقم جوال لولي الأمر. أضفه من «تعديل بيانات الطالب».');window.open('https://wa.me/'+ph(s.ph)+'?text='+encodeURIComponent(t),'_blank');return}
if(m=='s'&&navigator.share){navigator.share({text:t}).catch(()=>{});return}
const u=plink(s);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>toast('تم نسخ رابط '+s.name)).catch(()=>prompt('انسخ الرابط:',u));else prompt('انسخ الرابط:',u)}
function delSt(i){const c=C(),s=c.students.find(x=>x.id==i);if(!s)return;
if(!confirm('حذف الطالب «'+s.name+'» نهائياً مع كل تسميعه وتقاريره؟\nلا يمكن التراجع.'))return;
const tk=s.tk;c.students=c.students.filter(x=>x.id!=i);c.logs=(c.logs||[]).filter(l=>l.sid!=i);save();
fs.collection('logs').where('sid','==',i).get().then(q=>q.docs.forEach(d=>d.ref.delete())).catch(()=>{});
if(tk){const o=c.students.some(x=>x.tk==tk),r=fs.collection('pub').doc(tk);(o?r.update({['k.'+i]:firebase.firestore.FieldValue.delete()}):r.delete()).catch(()=>{})}
toast('تم حذف الطالب');R()}
function pMsg(){const c=C(),t=V('mt').trim(),ids=[...document.querySelectorAll('.ms:checked')].map(x=>x.value);if(!t||!ids.length)return alert('اكتب الرسالة وحدد الطلاب');
if(!confirm('إرسال الرسالة عبر البوابة إلى '+ids.length+' طالب؟'))return;
ids.forEach(i=>{const s=c.students.find(x=>x.id==i);if(s)pubDay(c,s,today(),'📢 رسالة من الإدارة:\n'+t)});save();toast('أُرسلت الرسالة عبر البوابة');}
function saveInfo(i){const s=C().students.find(x=>x.id==i),n=V('en_'+i).trim();if(!n)return alert('اكتب اسم الطالب');const p=V('ep_'+i);if(ph(p)!=ph(s.ph))delete s.tk;s.name=n;s.ph=p;save();toast('تم حفظ بيانات الطالب');R()}
function cuEd(s,j){const K=CK(s),k=Object.keys(K)[j],u=K[k],p='e'+j+'_'+s.id;
return`<div class="st"><b>${E(k)}</b><span class="mu">من سورة ← إلى سورة</span><div class="row"><select id="${p}f">${SO(u.s0)}</select><select id="${p}t">${SO(u.e)}</select></div><span class="mu">الموضع الحالي (سورة وآية)</span><div class="row"><select id="${p}s">${SO(u.s)}</select><input id="${p}a" type="number" min="1" inputmode="numeric" value="${Math.min(u.a,AC[u.s])}"></div><div class="row"><button class="o" onclick="saveCu('${s.id}',${j})">حفظ</button>${Object.keys(K).length>1?`<button class="o" onclick="delCu('${s.id}',${j})">حذف المنهج</button>`:''}</div></div>`}
function saveCu(i,j){const s=C().students.find(x=>x.id==i),k=Object.keys(CK(s))[j],u=CK(s)[k],p='e'+j+'_'+i,a=+V(p+'f'),b=+V(p+'t'),n=+V(p+'s'),na=Math.max(1,Math.min(+V(p+'a')||1,AC[n]));
if(n<Math.min(a,b)||n>Math.max(a,b))return alert('الموضع الحالي خارج نطاق المنهج');
if(!(n==u.s&&na==Math.min(u.a,AC[u.s]))){u.s=n;u.a=na}u.s0=a;u.e=b;u.dr=b>=a?1:-1;
if(u.a>AC[u.s]&&u.s!=u.e){u.s+=u.dr;u.a=1}save();toast('تم حفظ «'+k+'»');R()}
function addCu(i){const s=C().students.find(x=>x.id==i),k=V('nk_'+i).replace(/[.\/\[\]*`~]/g,'').trim();if(!k)return alert('اكتب اسم المنهج');if(CK(s)[k])return alert('اسم المنهج موجود');CK(s)[k]=mkCu(+V('nf_'+i),+V('nt_'+i));save();toast('تمت إضافة المنهج');R()}
function delCu(i,j){const K=CK(C().students.find(x=>x.id==i)),k=Object.keys(K)[j];if(Object.keys(K).length<2)return;if(confirm('حذف منهج «'+k+'»؟')){delete K[k];save();R()}}
function mvH(i,h){C().students.find(s=>s.id==i).h=h;save();R()}
function msgFill(t,o){return t.replace(/\{(.+?)\}/g,(m,k)=>o[k]??m)}
function tMsg(c){const sel=c.students.map(s=>`<label class="ck"><input type="checkbox" class="ms" value="${s.id}"><span>${E(s.name)} <span class="mu">${E((c.halaqat.find(h=>h.id==s.h)||{}).name||'')}</span></span></label>`).join('');
return portalCard(c)+`<div class="card"><h2>رسالة عامة</h2><p class="mu">تُفتح الرسائل مباشرة في واتساب الجوال الذي تستخدمه الآن.</p><textarea id="mt" placeholder="نص الرسالة"></textarea><label class="ck"><input type="checkbox" onchange="document.querySelectorAll('.ms').forEach(x=>x.checked=this.checked)"><b>تحديد الكل</b></label>${sel||'<p class="mu">لا طلاب</p>'}<div class="row"><button onclick="pMsg()">إرسال عبر البوابة</button><button class="o" onclick="qMsg()">إضافة إلى الصادر (واتساب)</button></div><p class="mu">«عبر البوابة» تظهر الرسالة لولي الأمر في رابطه الخاص وتصله كإشعار إن كان مفعّلاً.</p></div>`+outbox(c)}
function qMsg(){const c=C(),t=V('mt').trim(),ids=[...document.querySelectorAll('.ms:checked')].map(x=>x.value);if(!t||!ids.length)return alert('اكتب الرسالة وحدد الطلاب');
ids.forEach(i=>{const s=c.students.find(x=>x.id==i);addOut(c,{id:uid(),to:s.name,ph:s.ph,text:t,d:today()})});R()}
const pend=c=>c.out.filter(m=>!m.sent&&ph(m.ph)).sort((a,b)=>a.ts-b.ts);
function mk(r){fs.collection('out').doc(r).update({sent:1}).catch(()=>{})}
function nxt(){const c=C(),m=pend(c)[0];if(!m)return toast('انتهت كل الرسائل');mk(m.ref);m.sent=1;window.open('https://wa.me/'+ph(m.ph)+'?text='+encodeURIComponent(m.text),'_blank');R()}
function rt(r){fs.collection('out').doc(r).update({err:firebase.firestore.FieldValue.delete()}).catch(()=>{})}
function outbox(c){const n=pend(c).length,nop=c.out.filter(m=>!m.sent&&!ph(m.ph)).length;
return`<div class="card"><h2>الصادر (${c.out.length}) · المتبقي ${n}</h2>${n?`<button style="width:100%;min-height:58px;font-size:18px;margin-bottom:8px" onclick="nxt()">إرسال التالي (${n} متبقٍ)</button><p class="mu">كل ضغطة تفتح واتساب برسالة الطالب التالي. اضغط «إرسال» في واتساب ثم ارجع للتطبيق واضغط «إرسال التالي».</p>`:''}${nop?`<p class="mu">${nop} رسالة بلا رقم جوال صحيح، لن تُرسل.</p>`:''}${c.out.slice(0,400).map(m=>`<div class="st" style="opacity:${m.sent?.55:1}"><b>${E(m.to)}</b> <span class="mu">${m.d}</span> ${m.sent?'<span class="pill ok">أُرسلت ✓</span>':''}${m.err?`<span class="pill" style="color:#b3382c">فشل: ${E(m.err)}</span> <button class="o s" onclick="rt('${m.ref}')">إعادة</button>`:''}<div class="mu" style="white-space:pre-wrap">${E(m.text)}</div><a class="w" target="_blank" rel="noopener" href="https://wa.me/${ph(m.ph)}?text=${encodeURIComponent(m.text)}" onclick="mk('${m.ref}')">إرسال واتساب</a></div>`).join('')||'<p class="mu">فارغ</p>'}${c.out.length?`<button class="o s" style="margin:8px 0 0 8px" onclick="if(confirm('حذف الرسائل المُرسلة؟')){C().out.filter(m=>m.sent).forEach(m=>fs.collection('out').doc(m.ref).delete())}">حذف المُرسلة</button><button class="o s" style="margin-top:8px" onclick="if(confirm('مسح كل الصادر؟')){C().out.forEach(m=>fs.collection('out').doc(m.ref).delete())}">مسح الكل</button>`:''}</div>`}
/* REPORTS */
function tRep(c){const r=S.rp||{f:today(),t:today(),h:'',d:true};
return`<div class="card np"><h2>تقرير</h2><div class="row"><div><span class="mu">من</span><input id="rf" type="date" value="${r.f}"></div><div><span class="mu">إلى</span><input id="rt" type="date" value="${r.t}"></div></div>${hsel(c,r.h,'rh',true)}<label class="ck"><input id="rd" type="checkbox" ${r.d?'checked':''}>تفصيل كل تسميع</label><button onclick="S.rp={f:V('rf'),t:V('rt'),h:V('rh'),d:$('rd').checked};R()">عرض</button> <button class="o" onclick="prn()">طباعة</button></div>`+(S.rp?repOut(c,S.rp):'')}
function repOut(c,r){const sc=scale(c),gv=l=>{const x=sc.find(y=>y.l==l);return x?x.v:parseFloat(l)};
const L=c.logs.filter(l=>l.d>=r.f&&l.d<=r.t&&(!r.h||l.h==r.h));const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'-';
const ms=[...new Set([...c.students.flatMap(x=>Object.keys(CK(x))),...L.map(l=>l.m).filter(Boolean)])],sts=c.students.filter(s=>!r.h||s.h==r.h);let h=`<div class="card"><h2>تقرير ${r.h?E(c.halaqat.find(x=>x.id==r.h).name):'المجمع كامله'}</h2><p class="mu">${r.f} إلى ${r.t}</p><div class="tw"><table><tr><th>الطالب</th>${ms.map(m=>`<th>${E(m)}<div class="mu">${c.uni?'وجوه':'وجوه / تقييم'}</div></th>`).join('')}<th>مجموع الوجوه</th><th>${c.uni?'التقييم الموحّد':'متوسط الكل'}</th><th>غياب</th></tr>`;
const hs={};
sts.forEach(s=>{const ls=L.filter(l=>l.sid==s.id);const g=ls.filter(l=>l.g!=null).map(l=>l.g);g.forEach(x=>(hs[s.h]=hs[s.h]||[]).push(x));
h+=`<tr><td>${E(s.name)}</td>${ms.map(m=>{const x=ls.filter(l=>l.m==m),gg=x.filter(l=>l.g!=null).map(l=>l.g);return`<td>${x.reduce((a,l)=>a+l.f,0)}${c.uni?'':`<div class="mu">${avg(gg)}</div>`}</td>`}).join('')}<td><b>${ls.reduce((a,l)=>a+(l.f||0),0)}</b></td><td>${avg(g)}</td><td>${ls.filter(l=>l.st=='a').length}</td></tr>`});
h+=`</table></div><p><b>متوسط الحلقات:</b> ${c.halaqat.filter(x=>hs[x.id]).map(x=>E(x.name)+': '+avg(hs[x.id])).join(' | ')||'-'}</p><p><b>مجموع وجوه المجمع/الحلقة:</b> ${L.reduce((a,l)=>a+(l.f||0),0)}</p></div>`;
if(r.d)h+=`<div class="card"><h2>التفصيل اليومي</h2><div class="tw"><table><tr><th>التاريخ</th><th>الطالب</th><th>النوع</th><th>التسميع</th><th>الوجوه</th><th>التقييم</th></tr>${L.sort((a,b)=>a.d<b.d?-1:1).map(l=>{const s=c.students.find(x=>x.id==l.sid);return`<tr><td>${l.d}</td><td>${E(s?s.name:'-')}</td><td>${l.st=='a'?'غائب':l.st=='n'?'حاضر بلا تسميع':E(l.m)}</td><td>${l.st=='r'?rng(l):'-'}</td><td>${l.f||0}</td><td>${E(l.ev||'-')}</td></tr>`}).join('')}</table></div></div>`;return h}
function prn(){const c=C(),r={f:V('rf'),t:V('rt'),h:V('rh'),d:$('rd').checked};S.rp=r;
const css='body{font-family:Tahoma,Arial,sans-serif;direction:rtl;padding:16px;color:#000;font-size:13px}h2{font-size:17px;margin:14px 0 6px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:4px;text-align:center}th{background:#eee}.mu{color:#555;font-size:12px}.bar{display:none}.card{margin:0 0 14px}';
const html='<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير</title><style>'+css+'</style></head><body><h2>'+E(c.name)+'</h2>'+repOut(c,r)+'<p class="mu" style="margin-top:14px">'+(new Date()).toLocaleDateString('ar-SA')+'</p><script>window.onload=function(){setTimeout(function(){print()},500)}<\/script></body></html>';
let w=null;try{w=window.open(URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'})),'_blank')}catch(e){}
if(!w){try{window.print()}catch(e){alert('تعذرت الطباعة من هذا المتصفح. افتح الموقع من متصفح سفاري أو كروم ثم اطبع.')}}}
/* SETTINGS */
function tSet(c){return`<div class="card"><h2>الحلقات</h2>${c.halaqat.map(h=>`<div class="st">${E(h.name)} - ${E(h.teacher||'')} <span class="mu">(سر: ${E(h.pass)})</span> <button class="s d" onclick="delH('${h.id}')">حذف</button></div>`).join('')}<input id="hn" placeholder="اسم الحلقة"><input id="ht" placeholder="اسم المعلم"><input id="hp" placeholder="كلمة مرور المعلم (افتراضي 1111)"><button onclick="addH()">إضافة حلقة</button></div>
<div class="card"><h2>طريقة التقييم</h2><p class="mu">سطر لكل تقدير بصيغة «الاسم:الدرجة». مثال: ممتاز:100 أو 10:10 أو 9:9</p><label class="ck"><input id="uni" type="checkbox" ${c.uni?'checked':''}><span><b>توحيد التقييم</b><br><span class="mu">عند التفعيل: يُسجَّل تقييم واحد لكل تسميع الطالب. وعند الإيقاف (الافتراضي): لكل منهج (حفظ / مراجعة…) تقييمه المستقل.</span></span></label><textarea id="sc">${E(c.scale)}</textarea></div>
<div class="card"><h2>نصوص الرسائل</h2><p class="mu">المتغيرات: {الطالب} {التقييم} {السورة} {الوجوه} {النوع} {الحلقة}</p><span class="mu">عند التسميع</span><textarea id="t1">${E(c.t1)}</textarea><span class="mu">حاضر ولم يسمّع</span><textarea id="t2">${E(c.t2)}</textarea><span class="mu">غائب</span><textarea id="t3">${E(c.t3)}</textarea></div>
<div class="card"><h2>كلمة مرور المشرف</h2><input id="cp" value="${E(c.pass)}" placeholder="كلمة مرور المشرف"><button onclick="saveSet()">حفظ الإعدادات</button></div>`}
function delH(i){const c=C(),n=c.students.filter(s=>s.h==i).length;if(n)return alert('في الحلقة '+n+' طالب. انقلهم إلى حلقة أخرى أولاً من تبويب الطلاب.');if(confirm('حذف الحلقة؟')){c.halaqat=c.halaqat.filter(h=>h.id!=i);save();R()}}
function addH(){const c=C();if(!V('hn').trim())return;c.halaqat.push({id:uid(),name:V('hn').trim(),teacher:V('ht'),pass:V('hp')||'1111'});save();R()}
function saveSet(){const c=C();c.scale=V('sc');c.uni=$('uni').checked;c.t1=V('t1');c.t2=V('t2');c.t3=V('t3');c.pass=V('cp')||'1111';save();alert('تم الحفظ')}
/* TEACHER */
function vTea(){const c=C(),h=c.halaqat.find(x=>x.id==S.hid),sc=scale(c),L=c.students.filter(s=>s.h==h.id);
return tp('حلقة '+h.name)+`<p class="mu">${today()} — اختر حالة كل طالب ثم سجّل تسميعه. البداية تلقائية من آخر موضع وصل إليه.</p>`+(L.map(s=>tcard(c,s,sc)).join('')||'<div class="card">لا طلاب في هذه الحلقة.</div>')+`<button id="sv" class="sv np" onclick="saveEv()" disabled>حفظ وإرسال (0)</button>`}
const cuBox=(c,s,x,sc,first)=>{const{k,q}=x,u=CK(s)[k],on=k==first,st=(id,d)=>`<button type="button" onclick="stp('${id}',${d},.5)">${d>0?'+':'−'}</button>`;
return`<div class="cu${on?'':' off'}" id="cu_${q}" data-q="${q}"><label class="cuh"><input type="checkbox" id="on_${q}" ${on?'checked':''} onchange="cuOn('${q}')"><b>${E(k)}</b></label><div id="cb_${q}" ${on?'':'hidden'}>
<div class="frm"><span class="mu">من (آخر موضع — ثابت)</span><b class="big" id="fr_${q}">${SN[u.s]} · آية ${u.a}</b></div>
<input type="hidden" id="s_${q}"><input type="hidden" id="a2_${q}"><span class="mu">إلى — اضغط على آخر آية سمّعها الطالب</span><div id="ay_${q}"></div>
<span class="mu">عدد الوجوه</span><div class="stp">${st('fc_'+q,-1)}<input id="fc_${q}" type="number" min="0" step="0.5" inputmode="decimal" value="1">${st('fc_'+q,1)}</div>
${c.uni?'':`<span class="mu">تقييم ${E(k)}</span>${chips('ev_'+q,sc.map(y=>y.l),'')}`}</div></div>`};
function cuOn(q){const on=$('on_'+q).checked;$('cb_'+q).hidden=!on;$('cu_'+q).classList.toggle('off',!on);if(on)pick(q)}
function tcard(c,s,sc,sup){const K=CK(s),ks=Object.keys(K),i=s.id,first=ks.find(k=>!fin(K[k]));if(allFin(s))return sup?'<p class="mu">أتمّ الطالب المنهج</p>':`<div class="card"><div class="th"><b>${E(s.name)}</b><span class="pill ok">أتمّ المنهج ✓</span></div></div>`;
const cus=ks.map((k,j)=>({k,q:i+'_'+j})).filter(x=>!fin(K[x.k]));
return`<div class="${sup?'tc':'card tc'}" id="c_${i}">${sup?'':`<div class="th"><b>${E(s.name)}</b></div>${ks.map(k=>`<div class="mu">${E(k)}</div>${bar(K[k])}`).join('')}`}<div class="seg3">${[['r','سمّع'],['n','حضر بلا تسميع'],['a','غائب']].map(([k,n])=>`<button type="button" data-k="${k}" onclick="tg('${i}','${k}')">${n}</button>`).join('')}</div><input type="hidden" id="st_${i}">
<div id="f_${i}" hidden><span class="mu">فعّل المنهج الذي سمّعه الطالب${c.uni?'':' — لكل منهج تقييمه المستقل'}</span>${cus.map(x=>cuBox(c,s,x,sc,first)).join('')}${c.uni?`<div class="cu"><span class="mu">التقييم الموحّد لكل المناهج</span>${chips('ev_'+i,sc.map(x=>x.l),'')}</div>`:''}${sup?`<span class="mu">التاريخ</span><input id="sdt_${i}" type="date" value="${today()}"><button type="button" style="width:100%;margin-top:8px" onclick="supSave('${i}')">حفظ التسميع</button>`:''}</div></div>`}
const QC={},AD=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const SM=q=>{const a=q.split('_'),s=C().students.find(x=>x.id==a[0]),k=Object.keys(CK(s))[+a[1]];return{s,k,u:CK(s)[k]}};
async function getJ(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);try{const x=await fetch(u,{signal:c.signal});if(!x.ok)throw new Error('HTTP '+x.status);return await x.json()}finally{clearTimeout(t)}}
const nb=t=>t.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/\u0671/g,'ا');
function nobism(t,n){if(n>1&&n!=9&&nb(t).startsWith('بسم الله الرحمن الرحيم '))return t.split(' ').slice(4).join(' ');return t}
const PGK={},PC={},PGT={};
async function pageOf(n,a){const k=(n+1)+':'+a;if(PGK[k])return PGK[k];let p=null;
try{const d=await getJ('https://api.quran.com/api/v4/verses/by_key/'+k);p=d.verse&&d.verse.page_number}catch(e){}
if(!p){const d=await getJ('https://api.alquran.cloud/v1/ayah/'+k);p=d.data&&d.data.page}
if(!p)throw new Error('تعذر تحديد رقم الصفحة');PGK[k]=+p;return +p}
async function loadPage(P){if(PC[P])return PC[P];
try{const j=JSON.parse(localStorage.getItem('q4_'+P));if(j&&j.r&&j.r.length&&j.tot){PC[P]=j;PGT[P]=j.tot;j.r.forEach(v=>PGK[(v.n+1)+':'+v.a]=P);return j}}catch(e){}
let r=null,src='';const why=[];
try{const d=await getJ('https://api.quran.com/api/v4/quran/verses/qpc_hafs?page_number='+P);const t=(d.verses||[]).map(v=>{const m=String(v.verse_key).split(':');return{n:+m[0]-1,a:+m[1],t:v.text_qpc_hafs||v.text_uthmani||v.text}});if(t.length&&t.every(x=>x.t&&x.t.length&&x.a>0)){r=t;src='مجمع الملك فهد (QPC Hafs)'}else why.push('A:'+t.length)}catch(e){why.push('A:'+(e.message||e))}
if(!r){try{const d=await getJ('https://api.alquran.cloud/v1/page/'+P+'/quran-uthmani');const t=d.data.ayahs.map(x=>({n:x.surah.number-1,a:x.numberInSurah,t:x.numberInSurah==1?nobism(x.text,x.surah.number):x.text}));if(t.length){r=t;src='نص عثماني (مصدر احتياطي)'}else why.push('B:0')}catch(e){why.push('B:'+(e.message||e))}}
if(!r)throw new Error(why.join(' | '));
r.forEach(v=>{v.t=cl(v.t);v.w=nb(v.t).length+1});const o={r,src,tot:r.reduce((x,v)=>x+v.w,0)};
PC[P]=o;PGT[P]=o.tot;r.forEach(v=>PGK[(v.n+1)+':'+v.a]=P);try{localStorage.setItem('q4_'+P,JSON.stringify(o))}catch(e){}return o}
const OKV=/^[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF\u200c\u200d\s]+$/,PK={},FACE=660,cl=t=>t.replace(/[\s\u06DD\uFD3E\uFD3F]*[\u0660-\u0669\u06F0-\u06F90-9]+\s*$/,"");
async function pick(q){const b=$('ay_'+q);if(!b||b.innerHTML)return;
const st=SM(q).u;if(fin(st)){b.innerHTML='<p class="mu">أتمّ الطالب هذا المنهج</p>';return}PK[q]={n:st.s,a:st.a,fin:false,pg:null};
b.innerHTML=`<div class="ay mush" id="mu_${q}"></div><p class="mu" id="mi_${q}">اضغط على آخر آية سمّعها الطالب</p><p class="mu" id="mr_${q}"></p><button type="button" class="o" style="width:100%" id="mb_${q}" onclick="more('${q}')">الوجه التالي ▼</button>`;
await more(q)}
async function more(q){const st=SM(q).u,p=PK[q],box=$('mu_'+q),btn=$('mb_'+q),d=dirOf(st);if(!p||p.fin)return;
btn.disabled=true;$('mi_'+q).textContent='جارٍ التحميل…';
try{const P=p.pg||await pageOf(p.n,p.a),pg=await loadPage(P),first=!box.children.length;
const vs=pg.r.filter(v=>v.n==p.n?v.a>=p.a:(d>0&&v.n>p.n&&v.n<=st.e));
if(!vs.length)throw new Error('لا توجد آيات في هذا الوجه');
let h=`<div class="fc">﴿ وجه ${AD(P)} ﴾ — مصحف المدينة</div>`;
vs.forEach((v,j)=>{if(v.a==1||(first&&!j))h+=`<b class="sn">${SN[v.n]}</b>`;if(!OKV.test(v.t))p.bad=1;
h+=`<span class="v" data-n="${v.n}" data-a="${v.a}" data-c="${v.w}" data-p="${P}" onclick="pv('${q}',this)">${E(v.t)} <b>﴿${AD(v.a)}﴾</b></span> `});
p.src=pg.src;const L=vs[vs.length-1];p.n=L.n;p.a=L.a+1;let same=true;
if(p.a>AC[p.n]){if(p.n==st.e)p.fin=true;else{p.n+=d;p.a=1;same=false}}
p.pg=p.fin?null:(d>0||same?P+1:null);
box.insertAdjacentHTML('beforeend',h);$('mr_'+q).textContent='المصدر: '+p.src+(/احتياطي/.test(p.src)?' — تنبيه: مصدر احتياطي، طابقه بالمصحف قبل الاعتماد.':'')+(p.bad?' — تنبيه: وُجد حرف غير معتاد في بعض الآيات.':'');$('mi_'+q).textContent='اضغط على آخر آية سمّعها الطالب';
if(p.fin){btn.textContent='نهاية المنهج';}else btn.disabled=false}
catch(e){$('mi_'+q).textContent='تعذر تحميل النص ('+(e.message||'')+')، يمكنك التحديد يدوياً';btn.disabled=false}}
function pv(q,el){const vs=[...$('mu_'+q).querySelectorAll('.v')],k=vs.indexOf(el),by={};
vs.forEach((v,j)=>{v.classList.toggle('sel',j<=k);v.classList.toggle('end',j==k);if(j<=k)by[v.dataset.p]=(by[v.dataset.p]||0)+ +v.dataset.c});
let f=0;for(const P in by)f+=by[P]/(PGT[P]||by[P]);f=Math.max(.5,Math.round(f*2)/2);
const n=+el.dataset.n,a=+el.dataset.a;
$('s_'+q).value=n;$('a2_'+q).value=a;$('fc_'+q).value=f;
$('mi_'+q).innerHTML='ينتهي عند: <b>'+SN[n]+' · آية '+a+'</b> (وجه '+AD(el.dataset.p)+') — نحو '+AD(f)+' وجه (يمكنك تعديل العدد)'}
function tg(i,k){$('st_'+i).value=k;document.querySelectorAll('#c_'+i+' .seg3 button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));$('f_'+i).hidden=k!='r';$('c_'+i).dataset.k=k;const sv=$('sv');if(sv){const n=document.querySelectorAll('.tc[data-k]').length;sv.textContent='حفظ وإرسال ('+n+')';sv.disabled=!n}if(k=='r')document.querySelectorAll('#c_'+i+' .cu[data-q]').forEach(d=>{if($('on_'+d.dataset.q).checked)pick(d.dataset.q)})}
function sa(i){const s=C().students.find(x=>x.id==i),n=+V('s_'+i),e=$('a2_'+i);$('ay_'+i).innerHTML='';e.max=AC[n];e.min=n==s.s?s.a:1;e.value=n==s.s?Math.min(s.a+9,AC[n]):AC[n];$('mx_'+i).textContent='آية النهاية ('+AD(e.min)+'–'+AD(AC[n])+')'}
function readEv(s){const i=s.id,st=V('st_'+i);if(!st)return null;const c=C(),o={s,st,items:[]};
if(st=='r'){const ds=[...document.querySelectorAll('#c_'+i+' .cu[data-q]')].filter(d=>$('on_'+d.dataset.q).checked);
if(!ds.length){alert('«'+s.name+'»: فعّل المنهج الذي سمّعه الطالب');return false}
for(const d of ds){const q=d.dataset.q,k=SM(q).k,w='«'+s.name+'» — '+k+': ';
if(!V('a2_'+q)){alert(w+'اختر نهاية التسميع من المصحف');return false}
const ev=V('ev_'+(c.uni?i:q));if(!ev){alert(w+'اختر التقييم');return false}
if(!(parseFloat(V('fc_'+q))>=0)){alert(w+'اكتب عدد الوجوه');return false}
o.items.push({k,s2:+V('s_'+q),a2:+V('a2_'+q),f:parseFloat(V('fc_'+q))||0,ev})}}
return o}
function logEv(c,h,o,d){const{s,st,items}=o,i=s.id,sc=scale(c);let text;
if(st=='r'){const tx=[];items.forEach((it,n)=>{const u=CK(s)[it.k],l={id:uid(),d,sid:i,h:h.id,st,m:it.k,s:u.s,a1:u.a,s2:it.s2,a2:it.a2,f:it.f,ev:it.ev},x=sc.find(y=>y.l==it.ev);l.g=x?x.v:null;adv(u,it.s2,it.a2);fs.collection('logs').add({...l,cid:c.id});
let t=msgFill(c.t1,{'الطالب':s.name,'التقييم':l.ev,'السورة':rng(l),'الوجوه':l.f,'النوع':l.m,'الحلقة':h.name});if(n&&/^السلام عليكم/.test(t))t=t.split('\n').slice(1).join('\n');tx.push(t)});text=tx.join('\n──────\n')}
else{fs.collection('logs').add({id:uid(),d,sid:i,h:h.id,st,cid:c.id});text=msgFill(st=='n'?c.t2:c.t3,{'الطالب':s.name,'التقييم':'','السورة':'','الوجوه':0,'النوع':'','الحلقة':h.name})}
pubDay(c,s,d,text);if(!c.pm)addOut(c,{id:uid(),to:s.name,ph:s.ph,text,d})}
function saveEv(){const c=C(),h=c.halaqat.find(x=>x.id==S.hid),Q=[];
for(const s of c.students.filter(x=>x.h==h.id&&!allFin(x))){const o=readEv(s);if(o===false)return;if(o)Q.push(o)}
if(!Q.length)return;Q.forEach(o=>logEv(c,h,o,today()));save();toast('تم حفظ '+Q.length+' وجُهزت رسائل أولياء الأمور');R()}
function supSave(i){const c=C(),s=c.students.find(x=>x.id==i),o=readEv(s);if(o===false)return;if(!o)return alert('اختر حالة الطالب أولاً');
logEv(c,c.halaqat.find(x=>x.id==s.h),o,V('sdt_'+i)||today());save();toast('تمت إضافة التسميع');R()}
if(OK){PQ?parent(PQ):R()}else $('app').innerHTML='<div class="card"><h2>الإعداد</h2><p>الصق إعدادات Firebase في الثابت FB أعلى الملف.</p></div>';
</script></body></html>
