if(!PQ)fs.collection('cx').onSnapshot(q=>{DB.cx=q.docs.map(d=>{const o=d.data(),p=DB.cx.find(x=>x.id==o.id);o.logs=p?p.logs:[];o.out=p?p.out:[];return o});soft()})}
const uid=()=>Math.random().toString(36).slice(2,9);
const E=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const $=i=>document.getElementById(i);const V=i=>($(i)||{}).value||'';
const C=()=>DB.cx.find(x=>x.id===S.cid);
const rg=(a,b,d)=>{const r=[];for(let i=a;d>0?i<=b:i>=b;i+=d)r.push(i);return r};
const dirOf=s=>s.dr||(s.e>=s.s0?1:-1),span=s=>rg(s.s,s.e,dirOf(s)),full=s=>rg(s.s0,s.e,dirOf(s)),fin=s=>s.a>AC[s.s]&&s.s==s.e;
function prog(s){const d=dirOf(s);let t=0,x=0;full(s).forEach(i=>{t+=AC[i];if(d>0?i<s.s:i>s.s)x+=AC[i];else if(i==s.s)x+=Math.min(s.a-1,AC[i])});return t?Math.round(x/t*100):0}
const bar=s=>`<div class="bar"><i style="width:${prog(s)}%"></i></div><div class="mu">${prog(s)}% من المنهج</div>`;
function adv(s,s2,a2){s.s=s2;s.a=a2+1;if(s.a>AC[s2]&&s2!=s.e){s.s=s2+dirOf(s);s.a=1}}
const rng=l=>l.s2==null||l.s2==l.s?SN[l.s]+' '+l.a1+'-'+l.a2:'من '+SN[l.s]+' '+l.a1+' إلى '+SN[l.s2]+' '+l.a2;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const chips=(id,arr,def)=>`<input type="hidden" id="${id}" value="${E(def)}"><div class="chips">${arr.map(x=>`<button type="button" class="${x==def?'on':''}" onclick="pk('${id}',this)">${E(x)}</button>`).join('')}</div>`;
function pk(id,b){$(id).value=b.textContent;[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x==b))}
function stp(id,d,k){const e=$(id),m=+e.min||0,x=+e.max||1e9;e.value=Math.min(x,Math.max(m,(+e.value||0)+d*k))}
const SO=(s,from=0,to=113)=>SN.map((n,i)=>i>=from&&i<=to?`<option value="${i}"${i==s?' selected':''}>${i+1}. ${n}</option>`:'').join('');
const logo=`<img src="${ICONURL}" alt="ترتيل">`;
function newCx(n,wa,p){return{id:uid(),name:n,wa,pass:p||'1111',halaqat:[],students:[],logs:[],out:[],
scale:"ممتاز:100\nجيد جداً:90\nجيد:80\nمقبول:70\nضعيف:50",methods:["حفظ","مراجعة","تثبيت","المراجعة الكبرى"],
t1:"السلام عليكم ولي أمر الطالب {الطالب}\nالتسميع اليوم: {السورة} ({الوجوه} وجه) - {النوع}\nالتقييم: {التقييم}",
t2:"السلام عليكم ولي أمر الطالب {الطالب}\nحضر الطالب اليوم ولم يسمّع.",
t3:"السلام عليكم ولي أمر الطالب {الطالب}\nنفيدكم بغياب الطالب اليوم عن حلقة {الحلقة}."}}
function scale(c){return c.scale.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const k=l.lastIndexOf(':');return k<0?{l,v:parseFloat(l)||0}:{l:l.slice(0,k).trim(),v:parseFloat(l.slice(k+1))||0}})}
function ph(p){p=String(p||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('0'))p='966'+p.slice(1);return p}
function R(){const a=$('app');const x=S.role;a.innerHTML=!x?vLogin():x=='g'?vGen():x=='s'?vSup():vTea()}
function tp(t){return`<div class="top np"><b>${E(t)}</b>${S.role=='g'&&S.cid?'<button onclick="S.cid=null;S.role=\'g\';R()">رجوع</button>':''}<button onclick="S.role=null;S.cid=null;R()">خروج</button></div>`}
/* LOGIN */
function vLogin(){const r=S.lr;const cs=DB.cx.map(c=>`<option value="${c.id}">${E(c.name)}</option>`).join('');
let f=`<input id="pw" type="password" placeholder="كلمة المرور" inputmode="numeric">`;
if(r!='g'){f=(cs?`<select id="lc" onchange="R2()">${cs}</select>`:'<p class="mu">لا توجد مجمعات بعد، يُنشئها المشرف العام أولاً.</p>')+(r=='t'?`<select id="lh"></select>`:'')+f}
setTimeout(R2,0);
return`<div class="hero">${logo}<h1>ترتيل</h1><p>جمعية تحفيظ القرآن الكريم بجلاجل</p></div><div class="card"><div class="seg">${[['g','مشرف عام'],['s','مشرف مجمع'],['t','معلم']].map(([k,n])=>`<button class="${r==k?'on':''}" onclick="S.lr='${k}';R()">${n}</button>`).join('')}</div><div style="margin-top:8px">${f}<button style="width:100%;margin-top:6px" onclick="doLogin()">دخول</button></div><p class="mu">كلمة المرور الافتراضية: 1111</p></div>`}
function R2(){const l=$('lh'),c=DB.cx.find(x=>x.id==V('lc'));if(l&&c)l.innerHTML=c.halaqat.map(h=>`<option value="${h.id}">${E(h.name)}</option>`).join('')}
function doLogin(){const p=V('pw'),r=S.lr;
if(r=='g'){if(p!=DB.gp)return alert('كلمة المرور غير صحيحة');S.role='g';S.cid=null}
else{const c=DB.cx.find(x=>x.id==V('lc'));if(!c)return alert('اختر المجمع');
if(r=='s'){if(p!=c.pass)return alert('كلمة المرور غير صحيحة');S.role='s';S.cid=c.id;S.tab='st';listen(c.id)}
else{const h=c.halaqat.find(x=>x.id==V('lh'));if(!h)return alert('اختر الحلقة');if(p!=h.pass)return alert('كلمة المرور غير صحيحة');S.role='t';S.cid=c.id;S.hid=h.id;listen(c.id)}}
R()}
/* GENERAL */
function vGen(){return tp('المشرف العام')+`<div class="card"><h2>إنشاء مجمع</h2><input id="n" placeholder="اسم المجمع"><input id="w" placeholder="رقم واتساب المجمع (05xxxxxxxx)" inputmode="tel"><input id="p" placeholder="كلمة مرور مشرف المجمع (افتراضي 1111)"><button onclick="addCx()">إضافة</button></div>`+DB.cx.map(c=>`<div class="card"><h3>${E(c.name)}</h3><span class="pill">${c.halaqat.length} حلقة</span> <span class="pill">${c.students.length} طالب</span><div class="row" style="margin-top:8px"><button class="s" onclick="enter('${c.id}')">إدارة المجمع</button><button class="s d" onclick="delCx('${c.id}')">حذف</button></div></div>`).join('')+`<div class="card"><h2>كلمة مرور المشرف العام</h2><input id="gp" placeholder="كلمة جديدة"><button onclick="if(V('gp')){DB.gp=V('gp');fs.doc('meta/main').set({gp:DB.gp});alert('تم')}">تغيير</button></div>`}
function addCx(){if(!V('n').trim())return;const c=newCx(V('n').trim(),V('w'),V('p'));fs.collection('cx').doc(c.id).set(strip(c)).then(R)}
function delCx(i){if(confirm('حذف المجمع وكل بياناته؟')){fs.collection('cx').doc(i).delete().then(()=>{DB.cx=DB.cx.filter(c=>c.id!=i);R()})}}
/* SUPERVISOR */
function vSup(){const c=C();const T=[['st','الطلاب'],['ms','الرسائل'],['rp','التقارير'],['se','الإعدادات']];
return tp('مجمع '+c.name)+`<div class="tabs np">${T.map(([k,n])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';R()">${n}</button>`).join('')}</div>`+({st:tStu,ms:tMsg,rp:tRep,se:tSet}[S.tab])(c)}
function hsel(c,v,id,all){return`<select id="${id}" ${id.startsWith('m_')?'':''}>${all?'<option value="">كل الحلقات</option>':''}${c.halaqat.map(h=>`<option value="${h.id}"${h.id==v?' selected':''}>${E(h.name)}</option>`).join('')}</select>`}
function tStu(c){if(!c.halaqat.length)return'<div class="card">أضف حلقة أولاً من «الإعدادات».</div>';
return`<div class="card"><h2>تسجيل طالب جديد</h2><input id="sn" placeholder="اسم الطالب"><input id="sp" placeholder="جوال ولي الأمر" inputmode="tel">${hsel(c,'','sh')}<span class="mu">يبدأ منهج الطالب</span><input type="hidden" id="sd" value="1"><div class="seg"><button type="button" class="on" onclick="sd(1,this)">من الفاتحة<br><small>إلى الناس</small></button><button type="button" onclick="sd(-1,this)">من الناس<br><small>إلى الفاتحة</small></button></div><span class="mu">يبدأ من سورة</span><select id="s1">${SO(0)}</select><button style="width:100%;margin-top:8px" onclick="addSt()">تسجيل الطالب</button></div>`+
c.halaqat.map(h=>`<div class="card"><h3>${E(h.name)} <span class="mu">${E(h.teacher||'')}</span></h3>${c.students.filter(s=>s.h==h.id).map(s=>`<div class="st"><div class="th"><b>${E(s.name)}</b><span class="pill${fin(s)?' ok':''}">${fin(s)?'أتمّ المنهج':SN[s.s]+' · آية '+s.a}</span></div>${bar(s)}<div class="mu">المنهج: ${SN[s.s0]} ← ${SN[s.e]}</div><details><summary>إضافة تسميع للطالب</summary>${tcard(c,s,scale(c),1)}</details><details><summary>تعديل (نقل أو تغيير الموضع)</summary><span class="mu">نقل إلى حلقة</span><select onchange="mvH('${s.id}',this.value)">${c.halaqat.map(x=>`<option value="${x.id}"${x.id==s.h?' selected':''}>${E(x.name)}</option>`).join('')}</select><span class="mu">الموضع الحالي (سورة وآية)</span><div class="row"><select id="ms_${s.id}">${full(s).map(n=>`<option value="${n}"${n==s.s?' selected':''}>${SN[n]}</option>`).join('')}</select><input id="ma_${s.id}" type="number" min="1" inputmode="numeric" value="${Math.min(s.a,AC[s.s])}"></div><button class="o" style="width:100%" onclick="mvS('${s.id}')">حفظ الموضع</button></details></div>`).join('')||'<p class="mu">لا طلاب</p>'}</div>`).join('')}
function sd(d,b){$('sd').value=d;[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x==b));$('s1').value=d>0?0:113}
function addSt(){const c=C();if(!V('sn').trim())return alert('اكتب اسم الطالب');const dr=+V('sd')||1,a=+V('s1');c.students.push({id:uid(),name:V('sn').trim(),ph:V('sp'),h:V('sh'),s0:a,e:dr>0?113:0,dr,s:a,a:1});save();toast('تم تسجيل الطالب');R()}
function mvH(i,h){C().students.find(s=>s.id==i).h=h;save();R()}
function mvS(i){const s=C().students.find(s=>s.id==i),n=+V('ms_'+i);s.s=n;s.a=Math.max(1,Math.min(+V('ma_'+i)||1,AC[n]));save();toast('تم حفظ الموضع');R()}
function msgFill(t,o){return t.replace(/\{(.+?)\}/g,(m,k)=>o[k]??m)}
function tMsg(c){const sel=c.students.map(s=>`<label class="ck"><input type="checkbox" class="ms" value="${s.id}"><span>${E(s.name)} <span class="mu">${E((c.halaqat.find(h=>h.id==s.h)||{}).name||'')}</span></span></label>`).join('');
return portalCard(c)+`<div class="card"><h2>رسالة عامة</h2><p class="mu">رقم واتساب المجمع: ${E(c.wa||'غير مربوط')}</p><textarea id="mt" placeholder="نص الرسالة"></textarea><label class="ck"><input type="checkbox" onchange="document.querySelectorAll('.ms').forEach(x=>x.checked=this.checked)"><b>تحديد الكل</b></label>${sel||'<p class="mu">لا طلاب</p>'}<button onclick="qMsg()">إضافة إلى الصادر</button></div>`+outbox(c)}
function qMsg(){const c=C(),t=V('mt').trim(),ids=[...document.querySelectorAll('.ms:checked')].map(x=>x.value);if(!t||!ids.length)return alert('اكتب الرسالة وحدد الطلاب');
ids.forEach(i=>{const s=c.students.find(x=>x.id==i);addOut(c,{id:uid(),to:s.name,ph:s.ph,text:t,d:today()})});R()}
const pend=c=>c.out.filter(m=>!m.sent&&ph(m.ph)).sort((a,b)=>a.ts-b.ts);
function mk(r){fs.collection('out').doc(r).update({sent:1}).catch(()=>{})}
function nxt(){const c=C(),m=pend(c)[0];if(!m)return toast('انتهت كل الرسائل');mk(m.ref);m.sent=1;window.open('https://wa.me/'+ph(m.ph)+'?text='+encodeURIComponent(m.text),'_blank');R()}
function rt(r){fs.collection('out').doc(r).update({err:firebase.firestore.FieldValue.delete()}).catch(()=>{})}
function outbox(c){const n=pend(c).length,nop=c.out.filter(m=>!m.sent&&!ph(m.ph)).length;
return`<div class="card"><h2>الصادر (${c.out.length}) · المتبقي ${n}</h2>${n?`<button style="width:100%;min-height:58px;font-size:18px;margin-bottom:8px" onclick="nxt()">إرسال التالي (${n} متبقٍ)</button><p class="mu">كل ضغطة تفتح واتساب برسالة الطالب التالي. اضغط «إرسال» في واتساب ثم ارجع للتطبيق واضغط «إرسال التالي».</p>`:''}${nop?`<p class="mu">${nop} رسالة بلا رقم جوال صحيح، لن تُرسل.</p>`:''}${c.out.length?'<button class="o" style="width:100%;margin-bottom:8px" onclick="exX()">تصدير إكسل (نسخة أو لنظام إرسال جماعي)</button>':''}${c.out.slice(0,400).map(m=>`<div class="st" style="opacity:${m.sent?.55:1}"><b>${E(m.to)}</b> <span class="mu">${m.d}</span> ${m.sent?'<span class="pill ok">أُرسلت ✓</span>':''}${m.err?`<span class="pill" style="color:#b3382c">فشل: ${E(m.err)}</span> <button class="o s" onclick="rt('${m.ref}')">إعادة</button>`:''}<div class="mu" style="white-space:pre-wrap">${E(m.text)}</div><a class="w" target="_blank" rel="noopener" href="https://wa.me/${ph(m.ph)}?text=${encodeURIComponent(m.text)}" onclick="mk('${m.ref}')">إرسال واتساب</a></div>`).join('')||'<p class="mu">فارغ</p>'}${c.out.length?`<button class="o s" style="margin:8px 0 0 8px" onclick="if(confirm('حذف الرسائل المُرسلة؟')){C().out.filter(m=>m.sent).forEach(m=>fs.collection('out').doc(m.ref).delete())}">حذف المُرسلة</button><button class="o s" style="margin-top:8px" onclick="if(confirm('مسح كل الصادر؟')){C().out.forEach(m=>fs.collection('out').doc(m.ref).delete())}">مسح الكل</button>`:''}</div>`}
function exX(){const c=C();if(!c.out.length)return alert('الصادر فارغ');
const rows=[['الاسم','رقم الجوال','الرسالة','التاريخ']].concat(c.out.slice().reverse().map(m=>[m.to,ph(m.ph),m.text,m.d]));
if(window.XLSX){const w=XLSX.utils.aoa_to_sheet(rows),b=XLSX.utils.book_new();w['!cols']=[{wch:22},{wch:16},{wch:70},{wch:12}];XLSX.utils.book_append_sheet(b,w,'الرسائل');XLSX.writeFile(b,'رسائل-'+today()+'.xlsx')}
else{const q=v=>'"'+String(v).replace(/"/g,'""')+'"',t='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='رسائل-'+today()+'.csv';a.click()}
toast('تم تصدير '+c.out.length+' رسالة')}
/* REPORTS */
function tRep(c){const r=S.rp||{f:today(),t:today(),h:'',d:true};
return`<div class="card np"><h2>تقرير</h2><div class="row"><div><span class="mu">من</span><input id="rf" type="date" value="${r.f}"></div><div><span class="mu">إلى</span><input id="rt" type="date" value="${r.t}"></div></div>${hsel(c,r.h,'rh',true)}<label class="ck"><input id="rd" type="checkbox" ${r.d?'checked':''}>تفصيل كل تسميع</label><button onclick="S.rp={f:V('rf'),t:V('rt'),h:V('rh'),d:$('rd').checked};R()">عرض</button> <button class="o" onclick="print()">طباعة</button></div>`+(S.rp?repOut(c,S.rp):'')}
function repOut(c,r){const sc=scale(c),gv=l=>{const x=sc.find(y=>y.l==l);return x?x.v:parseFloat(l)};
const L=c.logs.filter(l=>l.d>=r.f&&l.d<=r.t&&(!r.h||l.h==r.h));const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'-';
const sts=c.students.filter(s=>!r.h||s.h==r.h);let h=`<div class="card"><h2>تقرير ${r.h?E(c.halaqat.find(x=>x.id==r.h).name):'المجمع كامله'}</h2><p class="mu">${r.f} إلى ${r.t}</p><div class="tw"><table><tr><th>الطالب</th>${c.methods.map(m=>`<th>${E(m)}</th>`).join('')}<th>مجموع الوجوه</th><th>متوسط الدرجات</th><th>غياب</th></tr>`;
const hs={};
sts.forEach(s=>{const ls=L.filter(l=>l.sid==s.id);const g=ls.filter(l=>l.g!=null).map(l=>l.g);g.forEach(x=>(hs[s.h]=hs[s.h]||[]).push(x));
h+=`<tr><td>${E(s.name)}</td>${c.methods.map(m=>`<td>${ls.filter(l=>l.m==m).reduce((a,l)=>a+l.f,0)}</td>`).join('')}<td><b>${ls.reduce((a,l)=>a+(l.f||0),0)}</b></td><td>${avg(g)}</td><td>${ls.filter(l=>l.st=='a').length}</td></tr>`});
h+=`</table></div><p><b>متوسط الحلقات:</b> ${c.halaqat.filter(x=>hs[x.id]).map(x=>E(x.name)+': '+avg(hs[x.id])).join(' | ')||'-'}</p><p><b>مجموع وجوه المجمع/الحلقة:</b> ${L.reduce((a,l)=>a+(l.f||0),0)}</p></div>`;
if(r.d)h+=`<div class="card"><h2>التفصيل اليومي</h2><div class="tw"><table><tr><th>التاريخ</th><th>الطالب</th><th>النوع</th><th>التسميع</th><th>الوجوه</th><th>التقييم</th></tr>${L.sort((a,b)=>a.d<b.d?-1:1).map(l=>{const s=c.students.find(x=>x.id==l.sid);return`<tr><td>${l.d}</td><td>${E(s?s.name:'-')}</td><td>${l.st=='a'?'غائب':l.st=='n'?'حاضر بلا تسميع':E(l.m)}</td><td>${l.st=='r'?rng(l):'-'}</td><td>${l.f||0}</td><td>${E(l.ev||'-')}</td></tr>`}).join('')}</table></div></div>`;return h}
/* SETTINGS */
function tSet(c){return`<div class="card"><h2>الحلقات</h2>${c.halaqat.map(h=>`<div class="st">${E(h.name)} - ${E(h.teacher||'')} <span class="mu">(سر: ${E(h.pass)})</span> <button class="s d" onclick="delH('${h.id}')">حذف</button></div>`).join('')}<input id="hn" placeholder="اسم الحلقة"><input id="ht" placeholder="اسم المعلم"><input id="hp" placeholder="كلمة مرور المعلم (افتراضي 1111)"><button onclick="addH()">إضافة حلقة</button></div>
<div class="card"><h2>طريقة التقييم</h2><p class="mu">سطر لكل تقدير بصيغة «الاسم:الدرجة». مثال: ممتاز:100 أو 10:10 أو 9:9</p><textarea id="sc">${E(c.scale)}</textarea><h2>طرق التسميع</h2><p class="mu">افصل بينها بفاصلة</p><input id="me" value="${E(c.methods.join('،'))}"></div>
<div class="card"><h2>نصوص الرسائل</h2><p class="mu">المتغيرات: {الطالب} {التقييم} {السورة} {الوجوه} {النوع} {الحلقة}</p><span class="mu">عند التسميع</span><textarea id="t1">${E(c.t1)}</textarea><span class="mu">حاضر ولم يسمّع</span><textarea id="t2">${E(c.t2)}</textarea><span class="mu">غائب</span><textarea id="t3">${E(c.t3)}</textarea></div>
<div class="card"><h2>واتساب المجمع وكلمة المرور</h2><input id="wa" value="${E(c.wa)}" placeholder="رقم واتساب المجمع"><input id="cp" value="${E(c.pass)}" placeholder="كلمة مرور المشرف"><button onclick="saveSet()">حفظ الإعدادات</button></div>`}
function delH(i){const c=C(),n=c.students.filter(s=>s.h==i).length;if(n)return alert('في الحلقة '+n+' طالب. انقلهم إلى حلقة أخرى أولاً من تبويب الطلاب.');if(confirm('حذف الحلقة؟')){c.halaqat=c.halaqat.filter(h=>h.id!=i);save();R()}}
function addH(){const c=C();if(!V('hn').trim())return;c.halaqat.push({id:uid(),name:V('hn').trim(),teacher:V('ht'),pass:V('hp')||'1111'});save();R()}
function saveSet(){const c=C();c.scale=V('sc');c.methods=V('me').split(/[,،\n]/).map(x=>x.trim()).filter(Boolean);c.t1=V('t1');c.t2=V('t2');c.t3=V('t3');c.wa=V('wa');c.pass=V('cp')||'1111';save();alert('تم الحفظ')}
/* TEACHER */
function vTea(){const c=C(),h=c.halaqat.find(x=>x.id==S.hid),sc=scale(c),L=c.students.filter(s=>s.h==h.id);
return tp('حلقة '+h.name)+`<p class="mu">${today()} — اختر حالة كل طالب ثم سجّل تسميعه. البداية تلقائية من آخر موضع وصل إليه.</p>`+(L.map(s=>tcard(c,s,sc)).join('')||'<div class="card">لا طلاب في هذه الحلقة.</div>')+`<button id="sv" class="sv np" onclick="saveEv()" disabled>حفظ وإرسال (0)</button>`}
function tcard(c,s,sc,sup){if(fin(s))return sup?'<p class="mu">أتمّ الطالب المنهج</p>':`<div class="card"><div class="th"><b>${E(s.name)}</b><span class="pill ok">أتمّ المنهج ✓</span></div></div>`;
const i=s.id,st=(k,d)=>`<button type="button" onclick="stp('${k}',${d},.5)">${d>0?'+':'−'}</button>`;
return`<div class="${sup?'tc':'card tc'}" id="c_${i}">${sup?'':`<div class="th"><b>${E(s.name)}</b></div>${bar(s)}`}<div class="seg3">${[['r','سمّع'],['n','حضر بلا تسميع'],['a','غائب']].map(([k,n])=>`<button type="button" data-k="${k}" onclick="tg('${i}','${k}')">${n}</button>`).join('')}</div><input type="hidden" id="st_${i}">
<div id="f_${i}" hidden><div class="frm"><span class="mu">من (آخر موضع — ثابت)</span><b class="big">${SN[s.s]} · آية ${s.a}</b></div>
<input type="hidden" id="s_${i}"><input type="hidden" id="a2_${i}"><span class="mu">إلى — اضغط على آخر آية سمّعها الطالب</span><div id="ay_${i}"></div>
<span class="mu">نوع التسميع</span>${chips('m_'+i,c.methods,c.methods[0])}<span class="mu">عدد الوجوه</span><div class="stp">${st('fc_'+i,-1)}<input id="fc_${i}" type="number" min="0" step="0.5" inputmode="decimal" value="1">${st('fc_'+i,1)}</div>
<span class="mu">التقييم</span>${chips('ev_'+i,sc.map(x=>x.l),'')}${sup?`<span class="mu">التاريخ</span><input id="sdt_${i}" type="date" value="${today()}"><button type="button" style="width:100%;margin-top:8px" onclick="supSave('${i}')">حفظ التسميع</button>`:''}</div></div>`}
const QC={},AD=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
async function getJ(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);try{const x=await fetch(u,{signal:c.signal});if(!x.ok)throw new Error('HTTP '+x.status);return await x.json()}finally{clearTimeout(t)}}
const nb=t=>t.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/\u0671/g,'ا');
function nobism(t,n){if(n>1&&n!=9&&nb(t).startsWith('بسم الله الرحمن الرحيم '))return t.split(' ').slice(4).join(' ');return t}
async function loadSurah(n){if(QC[n])return QC[n];try{const j=JSON.parse(localStorage.getItem('q3_'+n));if(j&&j.r&&j.r.length==AC[n]){QC[n]=j;return j}}catch(e){}
let r=null,src='';const why=[],c=n+1;
const ok=t=>t.length==AC[n]&&t.every(x=>typeof x=='string'&&x.length);
try{const d=await getJ('https://api.quran.com/api/v4/quran/verses/qpc_hafs?chapter_number='+c);const t=(d.verses||[]).map(v=>v.text_qpc_hafs||v.text_uthmani||v.text);if(ok(t)){r=t;src='مجمع الملك فهد (QPC Hafs)'}else why.push('A:'+t.length)}catch(e){why.push('A:'+(e.message||e))}
if(!r){try{const d=await getJ('https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/chapters/'+c+'.json');const t=d.verses.map((v,k)=>k?v.text:nobism(v.text,c));if(ok(t)){r=t;src='موسوعة القرآن (QuranEnc) - مصدر احتياطي'}else why.push('B:'+t.length)}catch(e){why.push('B:'+(e.message||e))}}
if(!r){try{const d=await getJ('https://api.alquran.cloud/v1/surah/'+c+'/quran-uthmani');const t=d.data.ayahs.map((a,k)=>k?a.text:nobism(a.text,c));if(ok(t)){r=t;src='نص عثماني (مصدر احتياطي)'}else why.push('C:'+t.length)}catch(e){why.push('C:'+(e.message||e))}}
if(!r)throw new Error(why.join(' | '));const o={r,src};QC[n]=o;try{localStorage.setItem('q3_'+n,JSON.stringify(o))}catch(e){}return o}
const OKV=/^[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF\u200c\u200d\s]+$/,PK={},FACE=660,cl=t=>t.replace(/[\s\u06DD\uFD3E\uFD3F]*[\u0660-\u0669\u06F0-\u06F90-9]+\s*$/,"");
async function pick(i){const b=$('ay_'+i);if(b.innerHTML)return;
const st=C().students.find(x=>x.id==i);PK[i]={n:st.s,a:st.a,fin:false};
b.innerHTML=`<div class="ay mush" id="mu_${i}"></div><p class="mu" id="mi_${i}">اضغط على آخر آية سمّعها الطالب</p><p class="mu" id="mr_${i}"></p><button type="button" class="o" style="width:100%" id="mb_${i}" onclick="more('${i}')">الوجه التالي ▼</button>`;
await more(i)}
async function more(i){const st=C().students.find(x=>x.id==i),p=PK[i],box=$('mu_'+i),btn=$('mb_'+i),d=dirOf(st);if(!p||p.fin)return;
btn.disabled=true;$('mi_'+i).textContent='جارٍ التحميل…';
try{let ch=0,first=!box.children.length,h=first?'':'<div class="fc">الوجه التالي</div>';
while(ch<FACE&&!p.fin){const o=await loadSurah(p.n);
while(p.a<=AC[p.n]&&ch<FACE){if(p.a==1||first){h+=`<b class="sn">${SN[p.n]}</b>`;first=false}
const t=cl(o.r[p.a-1]),c=nb(t).length;p.src=o.src;if(!OKV.test(t))p.bad=1;h+=`<span class="v" data-n="${p.n}" data-a="${p.a}" data-c="${c}" onclick="pv('${i}',this)">${E(t)} <b>﴿${AD(p.a)}﴾</b></span> `;ch+=c+1;p.a++}
if(p.a>AC[p.n]){if(p.n==st.e)p.fin=true;else{p.n+=d;p.a=1}}}
box.insertAdjacentHTML('beforeend',h);$('mr_'+i).textContent='المصدر: '+p.src+(/احتياطي/.test(p.src)?' — تنبيه: مصدر احتياطي، طابقه بالمصحف قبل الاعتماد.':'')+(p.bad?' — تنبيه: وُجد حرف غير معتاد في بعض الآيات.':'');$('mi_'+i).textContent='اضغط على آخر آية سمّعها الطالب';
if(p.fin){btn.textContent='نهاية المنهج';}else btn.disabled=false}
catch(e){$('mi_'+i).textContent='تعذر تحميل النص ('+(e.message||'')+')، يمكنك التحديد يدوياً';btn.disabled=false}}
function pv(i,el){const vs=[...$('mu_'+i).querySelectorAll('.v')],k=vs.indexOf(el);let ch=0;
vs.forEach((v,j)=>{v.classList.toggle('sel',j<=k);v.classList.toggle('end',j==k);if(j<=k)ch+=+v.dataset.c+1});
const n=+el.dataset.n,a=+el.dataset.a,f=Math.max(.5,Math.round(ch/FACE*2)/2);
$('s_'+i).value=n;$('a2_'+i).value=a;$('fc_'+i).value=f;
$('mi_'+i).innerHTML='ينتهي عند: <b>'+SN[n]+' · آية '+a+'</b> — نحو '+AD(f)+' وجه (يمكنك تعديل العدد)'}
function tg(i,k){$('st_'+i).value=k;document.querySelectorAll('#c_'+i+' .seg3 button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));$('f_'+i).hidden=k!='r';$('c_'+i).dataset.k=k;const sv=$('sv');if(sv){const n=document.querySelectorAll('.tc[data-k]').length;sv.textContent='حفظ وإرسال ('+n+')';sv.disabled=!n}if(k=='r')pick(i)}
function sa(i){const s=C().students.find(x=>x.id==i),n=+V('s_'+i),e=$('a2_'+i);$('ay_'+i).innerHTML='';e.max=AC[n];e.min=n==s.s?s.a:1;e.value=n==s.s?Math.min(s.a+9,AC[n]):AC[n];$('mx_'+i).textContent='آية النهاية ('+AD(e.min)+'–'+AD(AC[n])+')'}
function readEv(s){const i=s.id,st=V('st_'+i);if(!st)return null;const o={s,st};
if(st=='r'){if(!V('a2_'+i)){alert('«'+s.name+'»: اختر نهاية التسميع من المصحف');return false}
o.s2=+V('s_'+i);o.a2=+V('a2_'+i);
if(!V('ev_'+i)){alert('«'+s.name+'»: اختر التقييم');return false}
if(!(parseFloat(V('fc_'+i))>=0)){alert('«'+s.name+'»: اكتب عدد الوجوه');return false}}
return o}
function logEv(c,h,o,d){const{s,st,s2,a2}=o,i=s.id,sc=scale(c),l={id:uid(),d,sid:i,h:h.id,st};let t=c.t1;
if(st=='r'){l.m=V('m_'+i);l.s=s.s;l.a1=s.a;l.s2=s2;l.a2=a2;l.f=parseFloat(V('fc_'+i))||0;l.ev=V('ev_'+i);const x=sc.find(y=>y.l==l.ev);l.g=x?x.v:null;adv(s,s2,a2)}else t=st=='n'?c.t2:c.t3;
fs.collection('logs').add({...l,cid:c.id});const text=msgFill(t,{'الطالب':s.name,'التقييم':l.ev||'','السورة':l.s!=null?rng(l):'','الوجوه':l.f||0,'النوع':l.m||'','الحلقة':h.name});
pubDay(c,s,d,text);if(!c.pm)addOut(c,{id:uid(),to:s.name,ph:s.ph,text,d})}
function saveEv(){const c=C(),h=c.halaqat.find(x=>x.id==S.hid),Q=[];
for(const s of c.students.filter(x=>x.h==h.id&&!fin(x))){const o=readEv(s);if(o===false)return;if(o)Q.push(o)}
if(!Q.length)return;Q.forEach(o=>logEv(c,h,o,today()));save();toast('تم حفظ '+Q.length+' وجُهزت رسائل أولياء الأمور');R()}
function supSave(i){const c=C(),s=c.students.find(x=>x.id==i),o=readEv(s);if(o===false)return;if(!o)return alert('اختر حالة الطالب أولاً');
logEv(c,c.halaqat.find(x=>x.id==s.h),o,V('sdt_'+i)||today());save();toast('تمت إضافة التسميع');R()}
if(OK){PQ?parent(PQ):R()}else $('app').innerHTML='<div class="card"><h2>الإعداد</h2><p>الصق إعدادات Firebase في الثابت FB أعلى الملف.</p></div>';
</script></body></html>
